<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捨筏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbxTZvcSvcnn7uE2g7Dn8ElXr89yTNGFO6_ss4xJ4Bnw3EhF2ISniHkTC7JYMQd5P5JDrw/exec";
  const STORY = "捨筏（遊戲）";
</script>
<style>
  :root{
    --ink0:#17120e; --paper:#f1e7d9; --soft:#b7a899; --faint:#7c6f61;
    --clay:#c98a63; --clay-d:#a86f5e; --line:#3a2f26;
    --cjk:'Noto Serif TC',serif; --sans:'Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ink0);color:var(--paper);font-family:var(--cjk);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;touch-action:none}
  #stage{position:fixed;inset:0;display:block;cursor:crosshair}

  .hud{position:fixed;top:0;left:0;right:0;padding:20px 24px;display:flex;justify-content:space-between;
    align-items:baseline;font-family:var(--sans);font-size:13px;letter-spacing:.14em;color:var(--faint);z-index:5;pointer-events:none}
  .hud .t{color:var(--soft);font-variant-numeric:tabular-nums}

  .overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 28px;
    background:radial-gradient(ellipse at center, rgba(23,18,14,.5) 0%, rgba(23,18,14,.92) 72%);
    opacity:0;visibility:hidden;transition:opacity .6s ease}
  .overlay.on{opacity:1;visibility:visible}
  .kicker{font-family:var(--sans);font-size:13px;letter-spacing:.5em;color:var(--clay);text-indent:.5em;margin-bottom:26px}
  h1{font-size:clamp(40px,10vw,76px);font-weight:500;letter-spacing:.3em;text-indent:.3em;margin-bottom:28px}
  .say{font-size:clamp(17px,2.4vw,21px);line-height:2.1;color:var(--paper);max-width:25ch}
  .say .em{color:var(--clay)}
  .small{font-size:14px;color:var(--faint);letter-spacing:.08em;margin-top:18px}
  .btnrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:44px}
  button.b{font-family:var(--sans);font-size:16px;letter-spacing:.3em;text-indent:.3em;color:var(--ink0);
    background:var(--clay);border:none;border-radius:999px;padding:15px 44px;cursor:pointer;transition:opacity .2s,transform .1s}
  button.b:hover{opacity:.9}
  button.b:active{transform:scale(.97)}
  button.ghost{background:transparent;color:var(--soft);border:1px solid var(--line)}
  button.ghost:hover{color:var(--clay);border-color:var(--clay-d)}

  .end .t{font-size:clamp(26px,6vw,44px);font-weight:500;letter-spacing:.14em;margin-bottom:22px}
  .end .stat{font-family:var(--sans);font-size:14px;letter-spacing:.14em;color:var(--soft);margin-bottom:34px}
  .end .q{font-size:clamp(16px,2.3vw,20px);line-height:2.15;color:var(--paper);max-width:30ch}
  .end .q .em{color:var(--clay)}

  .form{max-width:440px;width:100%}
  .form .lead{font-size:clamp(16px,2.3vw,20px);line-height:2;color:var(--paper);margin-bottom:26px;max-width:28ch;margin-left:auto;margin-right:auto}
  .field{text-align:left;margin:0 auto 20px}
  .field label{display:block;font-family:var(--sans);font-size:13px;letter-spacing:.14em;color:var(--soft);margin-bottom:10px}
  .field input,.field textarea{width:100%;background:rgba(241,231,217,.04);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;font-family:var(--cjk);font-size:17px;color:var(--paper);line-height:1.8;outline:none}
  .field input::placeholder,.field textarea::placeholder{color:#6a5e51}
  .field input:focus,.field textarea:focus{border-color:var(--clay-d);background:rgba(241,231,217,.06)}
  .field textarea{min-height:110px;resize:vertical}
  .hint{font-family:var(--sans);font-size:13px;color:var(--faint);min-height:1.3em;margin-top:6px}

  @media(max-width:560px){ h1{letter-spacing:.18em;text-indent:.18em} }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="hud">
  <span class="t" id="clock">45.0</span>
  <span id="pct">圓滿 0%</span>
</div>

<!-- 開場 -->
<div class="overlay on" id="intro">
  <div class="kicker">不 只 讀 書 的 讀 書 會</div>
  <h1>捨　筏</h1>
  <p class="say">接住落下的光，<br>把那一槽，<span class="em">接到圓滿</span>。</p>
  <p class="small">接到就漲，漏掉就往下掉。</p>
  <div class="btnrow"><button class="b" id="startBtn">開　始</button></div>
</div>

<!-- 結束：圓滿 -->
<div class="overlay end" id="end">
  <div class="t" id="endTitle">圓滿了。</div>
  <div class="stat" id="endStat"></div>
  <p class="q" id="endQ"></p>
  <div class="btnrow">
    <button class="b ghost" id="againBtn">再來一次</button>
    <button class="b" id="toFormBtn">寫下感想</button>
  </div>
</div>

<!-- 結束：時間到、未圓滿 -->
<div class="overlay end" id="fail">
  <div class="t">時間到。</div>
  <div class="stat" id="failStat"></div>
  <p class="q" style="margin-top:6px">為何無法圓滿？<br>什麼是「<span class="em">非法，非非法</span>」？<br><br>再試試看——<br>怎樣才會圓滿？</p>
  <div class="btnrow">
    <button class="b ghost" id="failFormBtn">寫下感想</button>
    <button class="b" id="failAgainBtn">再試一次</button>
  </div>
</div>

<!-- 感想 -->
<div class="overlay" id="form">
  <div class="form">
    <div class="kicker" style="margin-bottom:22px">感 想</div>
    <p class="lead">讓它圓滿的，<br>原來不是接住，是放手。<br>你這一生，還抓著哪一槽？</p>
    <div class="field"><label>你的暱稱</label>
      <input id="nick" type="text" maxlength="60" placeholder="寫個名字，讓引導人認得你"></div>
    <div class="field"><label>你的感想</label>
      <textarea id="reflect" maxlength="2000" placeholder="我捨不得放手的那個……"></textarea></div>
    <div class="btnrow" style="margin-top:26px"><button class="b" id="sendBtn">送　出</button></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<!-- 完成 -->
<div class="overlay" id="done">
  <div class="kicker" style="color:var(--clay)">○</div>
  <p class="say" style="margin-top:8px">收到了。<br>就放下——<span class="em">我們見面再談。</span></p>
</div>

<script>
(function(){
  var cv=document.getElementById('stage'), ctx=cv.getContext('2d');
  var W,H,DPR;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    layout();
  }

  var ROUND=45, HINT_AT=92;
  // 規則自始至終不變：接到就漲，漏掉就扣。
  // 一旦曾經接近滿（出現「放下」），之後若把它扣到空＝圓滿。這一步不明說，讓玩家自己發現。
  var STATE='intro', phase='play';     // play → cross（落回空的收束）→ end
  var catchX, targetX, baseY, catchW, barTop, barBot, barX;
  var lights=[], sparks=[];
  var prog, combo, flash, downFlash, elapsed, spawnT, hinted, hintPulse, crossT, outcome;
  var cBefore, mBefore, cAfter, mAfter;   // 接/漏，分「非法非非法」前後

  function layout(){
    baseY=H*0.80; catchW=W*0.12; barX=W-W*0.085; barTop=H*0.13; barBot=H*0.80;
  }
  function reset(){
    layout();
    catchX=W/2; targetX=W/2; lights=[]; sparks=[];
    prog=0; combo=0; flash=0; downFlash=0; elapsed=0; spawnT=0;
    hinted=false; hintPulse=0; crossT=0; outcome='';
    cBefore=0; mBefore=0; cAfter=0; mAfter=0;
    phase='play';
    document.getElementById('clock').textContent=ROUND.toFixed(1);
    document.getElementById('pct').textContent='圓滿 0%';
  }
  resize(); addEventListener('resize', resize);

  function setX(x){ targetX=x*DPR; }
  cv.addEventListener('mousemove', function(e){ setX(e.clientX); });
  cv.addEventListener('touchmove', function(e){ var t=e.touches[0]; if(t) setX(t.clientX); }, {passive:true});
  cv.addEventListener('touchstart', function(e){ var t=e.touches[0]; if(t) setX(t.clientX); }, {passive:true});

  function spawn(){
    var m=W*0.08, rx=W-W*0.16;
    lights.push({x:m+Math.random()*(rx-m), y:-20*DPR, vy:(0.36+Math.random()*0.13)*H, r:(5+Math.random()*2)*DPR});
  }
  function burst(x,y,ok){ var n=ok?16:6;
    for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2, sp=(0.4+Math.random()*1.5)*DPR*(ok?1.4:0.7);
      sparks.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(ok?1*DPR:0),life:1,ok:ok}); } }

  var last=performance.now();
  function frame(now){
    var dt=Math.min(0.04,(now-last)/1000); last=now;
    catchX += (targetX-catchX)*Math.min(1,dt*10);
    if(flash>0) flash=Math.max(0,flash-dt);
    if(downFlash>0) downFlash=Math.max(0,downFlash-dt);
    if(hinted) hintPulse+=dt;

    if(STATE==='play'){
      elapsed+=dt;
      var timeLeft=Math.max(0,ROUND-elapsed);
      document.getElementById('clock').textContent=timeLeft.toFixed(1);

      if(phase!=='cross'){
        spawnT-=dt;
        var interval=Math.max(0.40,0.64-prog*0.002);
        if(spawnT<=0){ spawn(); spawnT=interval; }
      }

      // 落下 + 判定（規則不變：接到＝漲，漏掉＝扣）
      for(var i=lights.length-1;i>=0;i--){ var L=lights[i]; L.y+=L.vy*dt;
        var caught=(L.y>=baseY-8*DPR && L.y<=baseY+22*DPR && Math.abs(L.x-catchX)<catchW/2);
        if(caught){
          lights.splice(i,1); burst(L.x,baseY,true);
          if(hinted) cAfter++; else cBefore++;
          combo++; prog=Math.min(100, prog+(4+Math.min(combo,6))); flash=0.5;
          if(!hinted && prog>=HINT_AT){ hinted=true; hintPulse=0; }    // 只給「非法，非非法」，不說破
          continue;
        }
        if(L.y>H+20*DPR){ lights.splice(i,1); if(hinted) mAfter++; else mBefore++; combo=0; prog=Math.max(0, prog-7); downFlash=0.4; }
      }

      // 圓滿＝曾經接近滿、而後把它扣到空（讓玩家自己撞出來）
      if(hinted && prog<=0 && phase!=='cross'){ phase='cross'; crossT=0; }
      if(phase==='cross'){ crossT+=dt; if(crossT>1.6){ winEnd(); } }

      if(timeLeft<=0 && phase!=='cross'){ failEnd(); }

      document.getElementById('pct').textContent='圓滿 '+Math.round(prog)+'%';
    }

    // ---- 繪製 ----
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#17120e'; ctx.fillRect(0,0,W,H);

    if(STATE==='play'){
      drawBar();
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<lights.length;i++){ var L=lights[i];
        var g=ctx.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r*3.2);
        g.addColorStop(0,'rgba(255,238,205,0.95)'); g.addColorStop(0.4,'rgba(233,162,99,0.5)'); g.addColorStop(1,'rgba(233,162,99,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(L.x,L.y,L.r*3.2,0,7); ctx.fill();
      }
      for(var s=sparks.length-1;s>=0;s--){ var S=sparks[s]; S.x+=S.vx; S.y+=S.vy; S.vy+=0.05*DPR; S.life-=dt*1.6;
        if(S.life<=0){ sparks.splice(s,1); continue; }
        ctx.fillStyle=(S.ok?'rgba(255,224,170,':'rgba(150,120,100,')+(S.life*0.6)+')';
        ctx.beginPath(); ctx.arc(S.x,S.y,2*DPR,0,7); ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';

      // 缽
      var cross=(phase==='cross');
      var cy = cross? baseY-(crossT/1.6)*(baseY-barTop) : baseY;
      var bw=catchW;
      ctx.save();
      ctx.strokeStyle='rgba(255,243,224,'+((cross?Math.max(0,1-crossT/1.6):1)*0.95)+')'; ctx.lineWidth=4*DPR; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(catchX+bw/2, cy-16*DPR); ctx.lineTo(catchX+bw/2, cy);
      ctx.arc(catchX, cy, bw/2, 0, Math.PI, false);
      ctx.lineTo(catchX-bw/2, cy-16*DPR); ctx.stroke();
      ctx.restore();

      // 「放下」——只有兩個字，沒有說明
      if(hinted && phase!=='cross'){
        var a=0.5+0.3*Math.sin(hintPulse*1.6);
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='rgba(255,236,200,'+a+')'; ctx.font='500 '+(26*DPR)+'px "Noto Serif TC",serif';
        ctx.fillText('非法，非非法', W*0.5, H*0.34);
      }
    }
    requestAnimationFrame(frame);
  }

  function drawBar(){
    var w=W*0.03;
    ctx.fillStyle='rgba(120,108,92,0.18)';
    rrect(barX-w/2, barTop, w, barBot-barTop, w/2); ctx.fill();
    var fh=(prog/100)*(barBot-barTop), fy=barBot-fh;
    if(fh>1){
      var gg=ctx.createLinearGradient(0,barBot,0,barTop);
      gg.addColorStop(0,'rgba(201,138,99,0.85)'); gg.addColorStop(1,'rgba(255,214,150,0.95)');
      ctx.fillStyle=gg; rrect(barX-w/2, fy, w, fh, w/2); ctx.fill();
      if(flash>0){ ctx.globalCompositeOperation='lighter';
        ctx.fillStyle='rgba(255,240,210,'+(flash*0.5)+')'; rrect(barX-w/2, fy, w, Math.min(fh,18*DPR), w/2); ctx.fill();
        ctx.globalCompositeOperation='source-over'; }
    }
    if(downFlash>0){ ctx.fillStyle='rgba(120,90,70,'+(downFlash*0.5)+')'; rrect(barX-w/2, barBot-18*DPR, w, 18*DPR, w/2); ctx.fill(); }
    ctx.strokeStyle='rgba(183,168,153,0.4)'; ctx.lineWidth=2.5*DPR;
    ctx.beginPath(); ctx.moveTo(barX-w*0.9,barTop); ctx.lineTo(barX+w*0.9,barTop); ctx.stroke();
    ctx.fillStyle='rgba(154,144,130,0.65)';
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='500 '+(13*DPR)+'px "Noto Sans TC",sans-serif';
    ctx.fillText('圓滿', barX, barTop-8*DPR);
  }
  function rrect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  requestAnimationFrame(frame);

  function show(id){ ['intro','end','fail','form','done'].forEach(function(k){
    document.getElementById(k).classList.toggle('on', k===id); }); }

  function startGame(){ reset(); STATE='play'; show(null); }

  function statLine(){
    var caught=cBefore+cAfter, missed=mBefore+mAfter;
    var s='接住 '+caught+'　·　錯過 '+missed;
    s += hinted ? ('　｜　「非法，非非法」之後：又接 '+cAfter+'　·　錯過 '+mAfter)
                : '　｜　還沒走到「非法，非非法」';
    return s;
  }
  function winEnd(){
    STATE='end'; outcome='圓滿';
    document.getElementById('endTitle').textContent='圓滿了。';
    document.getElementById('endStat').textContent=statLine();
    document.getElementById('endQ').innerHTML=
      '你拚命把它接到快滿，<br>卻怎麼也圓滿不了。<br><br>直到你<span class="em">不再接</span>，<br>讓它一路落回空——<br>那一刻，才圓滿。<br>原來圓滿的不是滿，是<span class="em">放手</span>。';
    show('end');
  }
  function failEnd(){ STATE='fail'; outcome='未圓滿';
    document.getElementById('failStat').textContent=statLine(); show('fail'); }

  document.getElementById('startBtn').onclick=startGame;
  document.getElementById('againBtn').onclick=startGame;
  document.getElementById('failAgainBtn').onclick=startGame;
  document.getElementById('toFormBtn').onclick=function(){ STATE='form'; show('form'); };
  document.getElementById('failFormBtn').onclick=function(){ STATE='form'; show('form'); };

  document.getElementById('sendBtn').onclick=function(){
    var nick=document.getElementById('nick').value.trim();
    var reflect=document.getElementById('reflect').value.trim();
    var hint=document.getElementById('hint');
    if(!nick){ hint.textContent='請填一下你的暱稱。'; return; }
    if(!reflect){ hint.textContent='寫一句也好。'; return; }
    this.disabled=true; hint.textContent='送出中……';
    var caught=cBefore+cAfter, missed=mBefore+mAfter;
    var rec=outcome+'｜接'+caught+'漏'+missed+(hinted?('・後接'+cAfter+'漏'+mAfter):'');
    fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({story:STORY,nickname:nick,choice:rec,reason:reflect})
    }).then(function(){ STATE='done'; show('done'); }).catch(function(){ STATE='done'; show('done'); });
  };

  // QA
  if(location.hash==='#hint'){ reset(); show(null); STATE='play'; prog=94; hinted=true; }
  if(location.hash==='#win'){ reset(); cBefore=18;mBefore=6;cAfter=1;mAfter=11;hinted=true; STATE='end'; winEnd(); }
  if(location.hash==='#fail'){ reset(); cBefore=9;mBefore=14;cAfter=6;mAfter=4;hinted=true; STATE='fail'; failEnd(); }
})();
</script>
</body>
</html>
