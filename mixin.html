<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>覓心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbxTZvcSvcnn7uE2g7Dn8ElXr89yTNGFO6_ss4xJ4Bnw3EhF2ISniHkTC7JYMQd5P5JDrw/exec";
  const STORY = "覓心（遊戲）";
</script>
<style>
  :root{
    --ink0:#17120e; --paper:#f1e7d9; --soft:#b7a899; --faint:#7c6f61;
    --clay:#c98a63; --clay-d:#a86f5e; --line:#3a2f26;
    --cjk:'Noto Serif TC',serif; --sans:'Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ink0);color:var(--paper);font-family:var(--cjk);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;touch-action:none;
    background-image:radial-gradient(ellipse at 50% 38%, rgba(60,47,38,.5), rgba(23,18,14,0) 70%)}

  #stage{position:fixed;inset:0;overflow:hidden}

  .hud{position:fixed;top:0;left:0;right:0;padding:20px 24px;display:flex;justify-content:space-between;
    align-items:baseline;font-family:var(--sans);font-size:13px;letter-spacing:.14em;color:var(--faint);z-index:6;pointer-events:none}
  .hud .t{color:var(--soft);font-variant-numeric:tabular-nums}

  /* 題目導引（淡） */
  #guide{position:absolute;top:10.5%;left:0;right:0;text-align:center;font-size:clamp(15px,2.2vw,19px);
    letter-spacing:.22em;color:rgba(183,168,153,.5);z-index:3;pointer-events:none;transition:opacity .4s;padding:0 16px}
  #guide.study{color:rgba(243,234,217,.95);font-size:clamp(20px,3.3vw,30px);letter-spacing:.2em}
  /* 格子 */
  #slots{position:absolute;top:17%;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    z-index:3;pointer-events:none;padding:0 14px}
  .slot{width:clamp(30px,7.6vw,50px);height:clamp(30px,7.6vw,50px);border:1px dashed rgba(183,168,153,.35);
    border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(18px,4.4vw,28px);color:var(--paper);background:rgba(241,231,217,.015)}
  .slot.filled{border-color:var(--clay-d);border-style:solid;background:rgba(201,138,99,.1);
    animation:pop .25s ease}
  .slot.win{border-color:var(--clay);background:rgba(201,138,99,.2);color:#ffe9c9}
  .slot.bad{border-color:#b56b53;background:rgba(181,107,83,.18);animation:shake .3s}
  @keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* 字塊 */
  .tile{position:absolute;width:clamp(34px,8vw,52px);height:clamp(34px,8vw,52px);
    display:flex;align-items:center;justify-content:center;font-size:clamp(19px,4.6vw,30px);
    color:var(--paper);background:#241b14;border:1px solid var(--line);border-radius:12px;
    cursor:grab;z-index:4;user-select:none;touch-action:none;
    box-shadow:0 4px 14px rgba(0,0,0,.35);transition:left .24s cubic-bezier(.2,.7,.2,1),top .24s cubic-bezier(.2,.7,.2,1),opacity .3s}
  .tile.dragging{cursor:grabbing;z-index:20;transition:none;border-color:var(--clay);
    box-shadow:0 10px 26px rgba(0,0,0,.5);transform:scale(1.06)}
  .tile.used{opacity:0;pointer-events:none}
  .tile.heart-glow{color:#ffe9c9;border-color:var(--clay);background:#2a1f16;
    box-shadow:0 0 34px rgba(201,138,99,.5);text-shadow:0 0 18px rgba(201,138,99,.65);animation:pulseHeart 1.5s ease-in-out infinite}
  @keyframes pulseHeart{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

  /* 閃現題目 */
  #flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;
    pointer-events:none;opacity:0;padding:0 24px;text-align:center}
  #flash span{font-size:clamp(26px,5.5vw,46px);letter-spacing:.14em;color:#f5ead9}
  #flash.show{animation:flashseq 1.15s ease forwards}
  @keyframes flashseq{0%{opacity:0;transform:scale(.92)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.02)}}

  /* 結束剩下的「心」 */
  #lonely{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;
    pointer-events:none;opacity:0}
  #lonely span{font-size:clamp(90px,24vw,190px);color:#f3e7d9;text-shadow:0 0 50px rgba(201,138,99,.5)}
  #lonely.show{animation:lonely 3.4s ease forwards}
  @keyframes lonely{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}

  .overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 28px;
    background:radial-gradient(ellipse at center, rgba(23,18,14,.62) 0%, rgba(23,18,14,.95) 72%);
    opacity:0;visibility:hidden;transition:opacity .7s ease}
  .overlay.on{opacity:1;visibility:visible}
  .kicker{font-family:var(--sans);font-size:13px;letter-spacing:.5em;color:var(--clay);text-indent:.5em;margin-bottom:26px}
  h1{font-size:clamp(40px,10vw,76px);font-weight:500;letter-spacing:.3em;text-indent:.3em;margin-bottom:28px}
  .say{font-size:clamp(17px,2.4vw,21px);line-height:2.1;color:var(--paper);max-width:24ch}
  .say .em{color:var(--clay)}
  .small{font-size:14px;color:var(--faint);letter-spacing:.08em;margin-top:18px}
  .btnrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:44px}
  button.b{font-family:var(--sans);font-size:16px;letter-spacing:.3em;text-indent:.3em;color:var(--ink0);
    background:var(--clay);border:none;border-radius:999px;padding:15px 44px;cursor:pointer;transition:opacity .2s,transform .1s}
  button.b:hover{opacity:.9}
  button.b:active{transform:scale(.97)}
  button.ghost{background:transparent;color:var(--soft);border:1px solid var(--line)}
  button.ghost:hover{color:var(--clay);border-color:var(--clay-d)}

  .ask .q{font-size:clamp(23px,4.6vw,38px);font-weight:500;line-height:1.8;letter-spacing:.08em;color:var(--paper)}
  .ask .q .em{color:var(--clay)}

  .form{max-width:440px;width:100%}
  .form .lead{font-size:clamp(18px,2.6vw,23px);line-height:1.9;color:var(--paper);margin-bottom:26px;max-width:26ch;margin-left:auto;margin-right:auto}
  .field{text-align:left;margin:0 auto 20px}
  .field label{display:block;font-family:var(--sans);font-size:13px;letter-spacing:.14em;color:var(--soft);margin-bottom:10px}
  .field input,.field textarea{width:100%;background:rgba(241,231,217,.04);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;font-family:var(--cjk);font-size:17px;color:var(--paper);line-height:1.8;outline:none}
  .field input::placeholder,.field textarea::placeholder{color:#6a5e51}
  .field input:focus,.field textarea:focus{border-color:var(--clay-d);background:rgba(241,231,217,.06)}
  .field textarea{min-height:110px;resize:vertical}
  .hint{font-family:var(--sans);font-size:13px;color:var(--faint);min-height:1.3em;margin-top:6px}

  @media(max-width:560px){ h1{letter-spacing:.18em;text-indent:.18em} }
</style>
</head>
<body>

<div id="stage">
  <div id="guide"></div>
  <div id="slots"></div>
  <div id="flash"><span></span></div>
  <div id="lonely"><span>心</span></div>
</div>

<div class="hud">
  <span id="prog"></span>
  <span class="t" id="tip"></span>
</div>

<!-- 開場 -->
<div class="overlay on" id="intro">
  <div class="kicker">不 只 讀 書 的 讀 書 會</div>
  <h1>覓　心</h1>
  <p class="say">把散落的字，<br><span class="em">拖進格子，拼回句子。</span></p>
  <p class="small">五句，拼完就知道。</p>
  <div class="btnrow"><button class="b" id="startBtn">開　始</button></div>
</div>

<!-- 問句 -->
<div class="overlay ask" id="ask">
  <p class="q">剛剛玩的時候，<br>你的<span class="em">心</span>在哪裡？</p>
  <div class="btnrow"><button class="b" id="toFormBtn">寫下感想</button></div>
</div>

<!-- 感想 -->
<div class="overlay" id="form">
  <div class="form">
    <div class="kicker" style="margin-bottom:22px">感 想</div>
    <p class="lead">剛剛那麼專注的時候，<br>你的心，在哪裡？</p>
    <div class="field"><label>你的暱稱</label>
      <input id="nick" type="text" maxlength="60" placeholder="寫個名字，讓引導人認得你"></div>
    <div class="field"><label>你的感想</label>
      <textarea id="reflect" maxlength="2000" placeholder="剛剛拼字的時候，我……"></textarea></div>
    <div class="btnrow" style="margin-top:26px">
      <button class="b ghost" id="againBtn">再玩一次</button>
      <button class="b" id="sendBtn">送　出</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<!-- 完成 -->
<div class="overlay" id="done">
  <div class="kicker" style="color:var(--clay)">○</div>
  <p class="say" style="margin-top:8px">收到了。<br>就放下——<span class="em">我們見面再談。</span></p>
</div>

<script>
(function(){
  // ── 金剛經句庫（至少 20，隨機抽 5） ──
  // 句庫一律不含「心」字（心保留當廢用字）
  var SENTENCES = [
    "凡所有相，皆是虛妄","若見諸相非相，即見如來","一切有為法，如夢幻泡影",
    "如露亦如電，應作如是觀","法尚應捨，何況非法","是法平等，無有高下",
    "不取於相，如如不動","若以色見我，以音聲求我","是人行邪道，不能見如來",
    "所謂佛法者，即非佛法","一切聖賢，皆以無為法","如來者，無所從來",
    "知我說法，如筏喻者","實無有法，名為菩薩","離一切諸相，則名諸佛",
    "無法可說，是名說法","如來所得法，無實無虛","若菩薩有我相，即非菩薩",
    "一切諸佛，皆從此經出","不應取法，不應取非法","不可以身相得見如來",
    "若取法相，即著我相","實無眾生得滅度者","菩薩於法，應無所住",
    "如來說世界，即非世界","是實相者，即是非相"
  ];
  function clean(s){ return s.replace(/[，。！、；：？]/g,''); }

  var stage=document.getElementById('stage');
  var guideEl=document.getElementById('guide'), slotsEl=document.getElementById('slots');
  var flashEl=document.getElementById('flash'), flashSp=flashEl.querySelector('span');
  var lonely=document.getElementById('lonely');
  var progEl=document.getElementById('prog'), tipEl=document.getElementById('tip');

  var STATE='intro';
  var picks, idx, disp, chars, slotEls, tiles, placed, k, fails, between, hearts, countdownTimer, studying;

  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  function startGame(){
    picks=shuffle(SENTENCES).slice(0,5);
    idx=0; fails=0; hearts=[];
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
    STATE='play';
    show(null);
    loadSentence();
  }

  function loadSentence(){
    between=false;
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
    clearSentenceTiles();
    disp=picks[idx]; chars=clean(disp).split(''); k=0; placed=[];
    progEl.textContent='第 '+(idx+1)+' / 5 句';

    // 格子
    slotsEl.innerHTML=''; slotEls=[];
    for(var i=0;i<chars.length;i++){
      var sl=document.createElement('div'); sl.className='slot'; slotsEl.appendChild(sl); slotEls.push(sl);
    }

    var W=stage.clientWidth, Hh=stage.clientHeight;
    var ts=Math.max(34, Math.min(52, W*0.08));
    var pts=[];
    for(var hh=0;hh<hearts.length;hh++){ pts.push({x:parseFloat(hearts[hh].dataset.hx), y:parseFloat(hearts[hh].dataset.hy)}); }
    function far(x,y){ for(var q=0;q<pts.length;q++){ var dx=pts[q].x-x, dy=pts[q].y-y; if(dx*dx+dy*dy < (ts*1.28)*(ts*1.28)) return false; } return true; }
    function spot(){ var x,y,tries=0; do{ x=W*0.05+Math.random()*(W*0.90-ts); y=Hh*0.33+Math.random()*(Hh*0.60-ts); tries++; } while(!far(x,y) && tries<60); pts.push({x:x,y:y}); return {x:x,y:y}; }

    // 新增一個「心」廢用字（永遠用不到，持久累積）
    var hp=spot();
    var heart=document.createElement('div'); heart.className='tile heart'; heart.textContent='心'; heart.dataset.ch='心';
    heart.style.left=hp.x+'px'; heart.style.top=hp.y+'px'; heart.dataset.hx=hp.x; heart.dataset.hy=hp.y;
    stage.appendChild(heart); hearts.push(heart);

    // 本句字塊 + 誘餌（不含心）
    var pool=chars.slice();
    pool=pool.concat(decoys(chars, Math.min(6, 3+Math.floor(Math.random()*4))));
    pool=shuffle(pool);
    tiles=[];
    for(var t=0;t<pool.length;t++){
      var p=spot();
      var el=document.createElement('div'); el.className='tile'; el.textContent=pool[t]; el.dataset.ch=pool[t];
      el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.dataset.hx=p.x; el.dataset.hy=p.y;
      stage.appendChild(el); tiles.push(el);
    }

    // 閃現題目 10 秒，倒數後消失，逼人憑記憶拼
    guideEl.textContent=disp; guideEl.classList.add('study'); guideEl.style.opacity='1';
    studying=true;
    var left=10; tipEl.textContent='記住它…　'+left;
    countdownTimer=setInterval(function(){
      left--;
      if(left>0){ tipEl.textContent='記住它…　'+left; }
      else {
        clearInterval(countdownTimer); countdownTimer=null; studying=false;
        guideEl.style.opacity='0'; guideEl.classList.remove('study');
        tipEl.textContent='憑記憶，拖回來';
      }
    },1000);
  }

  function decoys(cur, n){
    var bag={}, i;
    for(i=0;i<SENTENCES.length;i++){ var cc=clean(SENTENCES[i]); for(var j=0;j<cc.length;j++){ bag[cc[j]]=1; } }
    for(i=0;i<cur.length;i++){ delete bag[cur[i]]; }
    var keys=Object.keys(bag); keys=shuffle(keys);
    return keys.slice(0, n);
  }

  function clearSentenceTiles(){
    if(tiles){ tiles.forEach(function(t){ t.remove(); }); }
    tiles=[]; slotsEl.innerHTML=''; slotEls=[];
  }

  // ── 拖拉 ──
  var drag=null;
  stage.addEventListener('pointerdown', function(e){
    if(STATE!=='play' || between || studying) return;
    var t=e.target.closest && e.target.closest('.tile');
    if(!t || t.classList.contains('used')) return;
    e.preventDefault();
    var r=t.getBoundingClientRect();
    drag={el:t, dx:e.clientX-r.left, dy:e.clientY-r.top};
    t.classList.add('dragging');
    try{ t.setPointerCapture(e.pointerId); }catch(_){}
  });
  stage.addEventListener('pointermove', function(e){
    if(!drag) return;
    drag.el.style.left=(e.clientX-drag.dx)+'px';
    drag.el.style.top=(e.clientY-drag.dy)+'px';
  });
  stage.addEventListener('pointerup', function(e){
    if(!drag) return;
    var t=drag.el; t.classList.remove('dragging'); drag=null;
    var sr=slotsEl.getBoundingClientRect();
    var over = e.clientX>sr.left-24 && e.clientX<sr.right+24 && e.clientY>sr.top-34 && e.clientY<sr.bottom+40;
    if(over){
      if(t.dataset.ch===chars[k]){ placeTile(t); }
      else { failSentence(t); }
    } else { springHome(t); }
  });

  function springHome(t){ t.style.left=t.dataset.hx+'px'; t.style.top=t.dataset.hy+'px'; }

  function placeTile(t){
    var sl=slotEls[k];
    var sr=sl.getBoundingClientRect(), pr=stage.getBoundingClientRect();
    t.style.left=(sr.left-pr.left+(sr.width-t.offsetWidth)/2)+'px';
    t.style.top=(sr.top-pr.top+(sr.height-t.offsetHeight)/2)+'px';
    setTimeout(function(){ t.classList.add('used'); }, 200);
    sl.textContent=chars[k]; sl.classList.add('filled');
    placed.push(t); k++;
    if(k>=chars.length) sentenceDone();
  }

  function failSentence(wrong){
    fails++;
    tipEl.textContent='不對，重來';
    slotEls.forEach(function(s){ s.classList.add('bad'); });
    springHome(wrong);
    setTimeout(function(){
      // 歸位：所有已放的字塊回散場，格子清空
      placed.forEach(function(t){ t.classList.remove('used'); springHome(t); });
      placed=[]; k=0;
      slotEls.forEach(function(s){ s.textContent=''; s.classList.remove('filled','bad'); });
      tipEl.textContent='拖字進格子';
    }, 420);
  }

  function sentenceDone(){
    between=true;
    tipEl.textContent='';
    slotEls.forEach(function(s){ s.classList.remove('filled'); s.classList.add('win'); });
    idx++;
    setTimeout(function(){
      if(idx<5){ loadSentence(); }
      else { endSequence(); }
    }, 950);
  }

  function endSequence(){
    STATE='end';
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
    clearSentenceTiles(); guideEl.textContent=''; guideEl.classList.remove('study'); guideEl.style.opacity=''; progEl.textContent=''; tipEl.textContent='';
    // 只剩下累積的五個「心」，一起發光
    hearts.forEach(function(h){ h.classList.add('heart-glow'); h.style.pointerEvents='none'; });
    setTimeout(function(){
      hearts.forEach(function(h){ h.style.animation='none'; h.style.transition='opacity 1s, transform 1s'; h.style.opacity='0'; h.style.transform='scale(1.5)'; });
      setTimeout(function(){ hearts.forEach(function(h){ h.remove(); }); hearts=[]; STATE='ask'; show('ask'); }, 1100);
    }, 2600);
  }

  function show(id){ ['intro','ask','form','done'].forEach(function(key){
    document.getElementById(key).classList.toggle('on', key===id); }); }

  document.getElementById('startBtn').onclick=startGame;
  document.getElementById('againBtn').onclick=startGame;
  document.getElementById('toFormBtn').onclick=function(){ show('form'); };

  document.getElementById('sendBtn').onclick=function(){
    var nick=document.getElementById('nick').value.trim();
    var reflect=document.getElementById('reflect').value.trim();
    var hint=document.getElementById('hint');
    if(!nick){ hint.textContent='請填一下你的暱稱。'; return; }
    if(!reflect){ hint.textContent='寫一句也好。'; return; }
    this.disabled=true; hint.textContent='送出中……';
    fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({story:STORY,nickname:nick,choice:'完成5句・重來'+fails+'次',reason:reflect})
    }).then(function(){ show('done'); }).catch(function(){ show('done'); });
  };

  // QA
  if(location.hash==='#ask'){ show('ask'); }
})();
</script>
</body>
</html>
