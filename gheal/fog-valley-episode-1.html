<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b2c"><title>霧谷紀事｜第一夜</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#182b2d;--fg:#eeeadd;--sub:#bec8bf;--gold:#d5b78a;--line:#7c8a8077;--sans:'Noto Sans TC',sans-serif;--serif:'Noto Serif TC',serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 12%,#3b5150,transparent 40%),linear-gradient(155deg,#112022,#223938);color:var(--fg);font-family:var(--serif);line-height:2;letter-spacing:.02em}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}body:before{content:'';position:fixed;inset:0;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");opacity:.2;pointer-events:none}.wrap{max-width:1120px;min-height:100vh;margin:auto;padding:15px 28px 25px;display:flex;flex-direction:column}.top{height:58px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff24;color:var(--sub);font:500 12px var(--sans);letter-spacing:.13em}.brand{display:flex;align-items:center;gap:12px}.seal{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font-size:19px}.menu{background:none;border:1px solid var(--line);padding:8px 14px;color:var(--sub);border-radius:20px;font:12px var(--sans)}main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0}.pane{width:min(100%,790px);min-height:560px;display:flex;flex-direction:column;justify-content:center;animation:in .3s ease-out}@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.kicker{font:700 11px var(--sans);color:var(--gold);letter-spacing:.23em}.hero{font:700 clamp(45px,8vw,90px)/1.4 var(--serif);letter-spacing:.11em;margin:25px 0}.lead{font-size:19px;color:var(--sub);line-height:2.4}.rule{width:80px;height:1px;background:var(--gold);margin:30px 0}.help{font:13px/2 var(--sans);color:var(--sub)}.small{font-size:12px;color:var(--sub)}.hero-art{position:absolute;right:0;bottom:0;width:220px;height:310px;opacity:.16;pointer-events:none}.title-pane{position:relative}.name{display:block;background:#ffffff0c;color:var(--fg);padding:11px 15px;border:1px solid var(--line);width:min(100%,330px);margin:8px 0 22px;border-radius:3px}.label{font:13px var(--sans);color:var(--sub);margin-top:20px}.primary{background:var(--gold);border:1px solid var(--gold);color:#1b2929;padding:12px 25px;font:700 14px var(--sans);letter-spacing:.11em;border-radius:2px}.primary:hover{background:#e6cda7}.secondary{background:transparent;border:1px solid var(--line);color:var(--fg);padding:11px 17px;font:500 13px var(--sans);border-radius:2px}.secondary:hover{border-color:var(--gold)}.scene-top{border-bottom:1px solid #ffffff2d;display:flex;align-items:center;justify-content:space-between;padding-bottom:17px;margin-bottom:30px;color:var(--gold);font:500 12px var(--sans);letter-spacing:.18em}.scene-top span:last-child{color:var(--sub)}.scene h2,.ending h2{font-size:clamp(30px,5vw,49px);line-height:1.5;font-weight:600;letter-spacing:.06em;margin:0 0 24px}.text{font-size:18px;line-height:2.24}.text p{margin:0 0 16px}.text blockquote{margin:20px 0 22px;border-left:2px solid var(--gold);padding:2px 0 2px 22px;color:#f2ddbf}.question{font:700 14px var(--sans);color:var(--gold);letter-spacing:.12em;margin:28px 0 13px}.choices{display:grid;gap:10px}.choice{display:flex;width:100%;text-align:left;align-items:start;gap:18px;padding:15px 19px;border:1px solid var(--line);border-radius:3px;background:#ffffff0a;color:var(--fg);font:16px/1.8 var(--serif)}.choice:hover{border-color:var(--gold);background:#dfd6b816}.num{font:500 12px var(--sans);color:var(--gold);padding-top:5px}.response{border:1px solid var(--line);background:#c6b6970c;padding:24px 28px;margin-top:22px;font-size:18px;line-height:2.25}.response .primary{margin-top:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.receipt{border:1px solid var(--line);padding:25px;margin:25px 0;background:#ffffff0d}.receipt .code{font:700 clamp(18px,3vw,27px)/1.7 var(--sans);letter-spacing:.08em;color:var(--gold);margin:12px 0;word-break:break-word}.ending p{font-size:18px;line-height:2.25}.ending summary{cursor:pointer;font:13px var(--sans);color:var(--sub)}.ending ol{font-size:14px}.foot{border-top:1px solid #ffffff25;color:var(--sub);display:flex;justify-content:space-between;gap:12px;padding-top:13px;font:12px/1.7 var(--sans)}.modal{position:fixed;inset:0;background:#061619e8;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-inner{max-width:440px;background:#e9e5d8;color:#273d3b;padding:30px}.modal-inner h3{font:700 22px var(--serif);margin:0}.modal-inner p{font:14px/2 var(--sans)}.modal-inner button{margin-right:7px}.modal-inner .secondary{color:#243b3c;border-color:#80908c}
@media(max-width:650px){.wrap{padding:7px 17px 20px}.pane{min-height:calc(100svh - 170px)}.hero{font-size:49px}.text{font-size:16px}.choice{font-size:15px;padding:12px}.scene h2{font-size:32px}.hero-art{width:150px;opacity:.1}.response{padding:20px}.foot span:last-child{text-align:right}}@media(prefers-reduced-motion:reduce){.pane{animation:none}html{scroll-behavior:auto}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><span class="seal">✦</span><span>霧谷紀事　<span class="small">FOG VALLEY</span></span></div><button class="menu" id="openMenu">遊戲選項</button></header><main id="app"></main><footer class="foot"><span>不只讀書的讀書會 · 療癒罪咎</span><span>第一集｜夜間記事</span></footer></div><div class="modal" id="modal"><div class="modal-inner"><h3>冒險選項</h3><p>遊戲進度會儲存在這個瀏覽器。重新開始會覆蓋原本紀錄；如果已經完成，請先保存承接碼。</p><button class="secondary" id="closeMenu">返回故事</button><button class="primary" id="reset">重新開始</button></div></div><script>
(()=>{'use strict';const key='gheal.fogvalley.first.v1',N=10;let state;function blank(){return {screen:'title',step:0,name:'',picks:[],history:[],flags:[],trust:0,eli:0,mira:0,food:0,clues:0,ending:''}}try{state=JSON.parse(localStorage.getItem(key))||blank();if(!state.screen||!Array.isArray(state.picks)||state.step>N)state=blank()}catch{state=blank()}const app=document.getElementById('app'),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),p=t=>'<p>'+t+'</p>',q=t=>'<blockquote>'+t+'</blockquote>',has=t=>state.flags.includes(t),save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}},boost=(a)=>{for(let k of ['trust','eli','mira','food','clues'])state[k]+=a[k]||0};
// Each decision contains: label, immediate consequence, hidden consequences, optional story flag.
const scenes=[
{title:'夜裡的火',time:'亥時 · 火光',text:()=>p('鐘聲響了三次。')+p('你是霧谷東門的夜間守衛。今晚，你曾離開哨位十一分鐘，為山坡上的診療所送去一包藥。醫師拜託你保密：病人是鎮長的幼子，消息傳開，恐怕引起恐慌。')+p('你回來時，糧倉已經起火。鎮長站在灰燼旁，手中握著一把鑰匙。那把鑰匙，本該掛在你的守衛室。')+q('「所有人都在等你解釋。」鎮長說。人群裡有人喊：「就是他失職！」')+p('雨把火壓住了，卻壓不住眾人的目光。'),ask:'你先做什麼？',opts:[
['說出自己去送藥，請鎮長證明。','鎮長的臉色變了，低聲叫你先別提孩子。人群只看見他阻止你說話。',{trust:1},'revealed'],
['要求鎮長拿出證據，不能隨意指控。','鎮長讓人安靜，卻反問你：「鑰匙為什麼會出現在火場？」你感覺自己被推進公開審問。',{trust:-1},'challenged'],
['指出接班守衛也碰過鑰匙。','接班守衛立刻被人圍住。他驚慌地辯解。至少此刻，目光不再全落在你身上。',{trust:-2},'blamed'],
['暫時沉默，先觀察現場和鑰匙。','你注意到鑰匙柄上有一小截藍色繩線。鎮長把它收進衣袋，叫人帶你離開。',{clues:1},'blue']
]},
{title:'十一分鐘',time:'亥時 · 守衛室',text:()=>p('鎮長把你帶回守衛室。燈還亮著，鑰匙鉤空空的，窗邊沾著新鮮的泥。')+p(has('revealed')?'「我知道你送藥是出於好意，」鎮長低聲說，「但你不該在大家面前提孩子。」':has('blamed')?'「你方才指認了接班人，」鎮長說，「可是值班簿上仍是你的名字。」':'「我需要一個能向居民交代的說法。」鎮長說。')+q('「你離開時，有誰知道鑰匙放在這裡？」')+p('你想起傍晚好友艾倫來送過熱湯。他是少數知道你可能要去診療所的人。'),ask:'你如何回答？',opts:[
['提起艾倫來過，但不指控他。','鎮長記下艾倫的名字，說要找他談談。你知道自己可能替朋友惹來麻煩。',{trust:1,eli:-1},'namedEli'],
['要求先私下找艾倫了解情況。','鎮長勉強給你半個時辰，叮囑你不得離鎮。你換到了時間，卻加深了他的疑慮。',{eli:1,trust:-1},'privateEli'],
['只說自己沒有偷鑰匙，其餘拒絕回答。','鎮長將守衛簿合上：「那我只好記下你拒絕配合。」',{trust:-2},'refused'],
['質問鎮長，診療所的秘密難道不是他的責任？','鎮長頓了一下，說：「不要把兩件事混為一談。」你們誰也沒有讓步。',{trust:-1},'challengedMayor']
]},
{title:'井邊的艾倫',time:'子時 · 古井',text:()=>p('你在老井旁找到艾倫。他袖口焦黑，正用冷水沖洗手臂。')+q('「我去過糧倉。」他說，「但火不是我放的。」')+p('他說起火時倉庫後門卡住，他從守衛室拿了備用鑰匙，從東側小門放人進去搬出麥袋。鑰匙大概掉在混亂中。')+p('「不要告訴他們，」艾倫抓著你的衣袖，「我欠著糧商的錢，他們只會說我去偷糧。」'),ask:'你怎麼回應？',opts:[
['答應保密，先保住朋友。','艾倫鬆了一口氣，卻沒有再看你。他告訴你糧倉後牆有條小路。',{eli:2,trust:-1},'secretEli'],
['請他跟你一起向鎮長說明。','「現在去，我會被當成賊！」他退後一步。你們僵持了很久，他最後說需要時間。',{eli:-1,trust:1},'inviteEli'],
['責怪他讓自己被懷疑，要求他立刻認錯。','「我是在救糧食！」艾倫的聲音冷下來。他丟下你，消失在霧中。',{eli:-2},'attackEli'],
['先追問鑰匙與後門的細節。','艾倫想了想：「門閂下午就壞了。倉庫的學徒米拉知道。」',{eli:1,clues:2},'doorClue']
]},
{title:'兩條街',time:'子時 · 岔路',text:()=>p('從井邊到糧倉，有兩條街。雨仍不停，鎮上的燈也沒有熄。')+p('黎明前，鎮長要宣布如何分配剩餘的糧食，也要決定誰該為這場火負責。你只剩一點時間。')+p('橋頭有居民排隊領水。有人看見你，便把臉轉向別處。'),ask:'你決定先去哪裡？',opts:[
['回守衛室，翻查夜間進出紀錄。','守衛簿寫著：傍晚有一輛載燈油的車，因暴雨改從東門入鎮。護送者的簽名潦草。',{clues:2},'logbook'],
['繞到糧倉後門查看。','你在門邊發現一張修繕告示，日期就是今天下午。門閂果然早就壞了。',{clues:2},'latch'],
['去議事廳找鎮長，要求停止對你的議論。','鎮長忙著跟糧商爭執，讓你在門外等候。等你終於見到他，天色已更深。',{trust:-1},'appeal'],
['沿河找搬運糧袋的居民打聽。','有人告訴你，火剛起來時，一位學徒抱著油燈跑出倉庫，手上都是灰。',{clues:1,mira:1},'river']
]},
{title:'火留下的東西',time:'丑時 · 糧倉',text:()=>p('糧倉只剩半邊屋頂。你從殘樑下找到一塊沾油的布。')+p(has('logbook')?'你想起夜間記錄裡那輛運燈油的車。這塊布也許曾用來包住漏油的桶口。':has('latch')?'你再次看向修繕告示。這場火之前，糧倉本來就不是完全安全的地方。':'你還不知道這塊布的來歷。它也可能只是搬貨時遺落。')+q('老倉丁走過來：「上頭都說你失職了，你還想找什麼？」'),ask:'你怎麼做？',opts:[
['請老倉丁一起辨認布與殘樑。','他起初不肯，最後蹲下來指出布上的繩結，是糧商用來封桶的。',{clues:2,trust:1},'worker'],
['把布先收好，自己保留證據。','你得到了線索，卻少了能證明來源的人。',{clues:1,trust:-1},'cloth'],
['要求老倉丁承認管理疏失。','他臉色漲紅，轉頭就去告訴別人你在推卸責任。',{trust:-2},'blameWorker'],
['先去找那位從火裡跑出的學徒。','你在焦黑的穀袋旁找到了米拉，她縮著身子，沒有抬頭。',{mira:2},'findMira']
]},
{title:'學徒米拉',time:'丑時 · 穀袋旁',text:()=>p('米拉只有十五歲，兩手纏著滲出血色的布。')+q('「我把油燈放在桶邊，只想看清楚帳本。風一吹，燈就翻了……我試著撲火，撲不掉。」')+p('她說糧商不准她提漏油的桶：「油不該放在那裡。但我也做錯了事。」')+p('街上有人高喊要抓到縱火的人。米拉抬頭問：「如果我出去，他們會怎麼對我？」'),ask:'你告訴她：',opts:[
['我可以陪你出去，把各自知道的說清楚。','她害怕得發抖，最後問：「你會一直站在我旁邊嗎？」',{mira:2,trust:1},'standMira'],
['你先躲起來，等我找更多證據。','她點頭躲進柴房，又問：「大家會不會覺得我逃跑了？」',{mira:1,trust:-1},'hideMira'],
['這是你造成的，應該由你去承認。','她忍著眼淚站起來，說知道了。你看得出，她還不知道自己接下來會遇到什麼。',{mira:-2},'blameMira'],
['先處理燙傷，其他事稍後再說。','米拉讓你幫她包紮。她說願意告訴你帳本藏在哪裡。',{mira:1,clues:1},'careMira']
]},
{title:'剩下的麥子',time:'寅時 · 街口',text:()=>p('居民在糧倉外排成長隊。火燒掉大部分冬糧，剩下的只夠全鎮撐五天。')+p('一個小孩在你腳邊跌倒，空碗碎了。有人喊：「你不是守衛嗎？快叫他們把糧食拿出來！」')+p('你想起自己仍在被調查。但眼前也確實有好幾個人，正在等一個答案。'),ask:'你此刻選擇：',opts:[
['加入搬運，把還能吃的麥子分出來。','你搬得手指發麻，多救出幾袋沒受潮的麥子。幾個人默默加入。',{food:2,trust:1},'carry'],
['去找糧商，要求開放他另外的存糧。','糧商說那批糧食已經有人預訂，除非有人願意擔保。你沒能立即說服他。',{food:1},'bargain'],
['告訴居民，不該把所有責任都推給你。','一位老婦人回道：「那麼，你希望我們現在怎麼辦？」你一時語塞。',{trust:-1},'defendCrowd'],
['先帶燒傷者去診療所。','你陪著傷者去診療所。醫師向你點頭，街上仍有不少人等著領糧。',{food:1,mira:1},'aid']
]},
{title:'鎮長的命令',time:'寅時 · 議事廳',text:()=>p('鎮長宣布要在日出前召開公開問訊，並要求你交出短刀，問訊結束前不得離鎮。')+q('「這是為了讓大家安心。」鎮長說。')+p(has('standMira')?'米拉站在你身旁，指尖冰冷。':has('hideMira')?'你不知道躲在柴房的米拉現在是否安全。':'你在人群裡找不到米拉。')+p('兩名守衛站在門邊，等你回應。'),ask:'面對命令，你決定：',opts:[
['交出短刀，但要求問訊也聽見其他人說話。','鎮長同意讓你提出證人名單。你失去武器，得到發言機會。',{trust:1},'hearing'],
['拒絕交刀，除非他先承認懷疑錯了。','兩名守衛走近，鎮長說：「我不會在威脅下收回命令。」',{trust:-2},'refuseBlade'],
['先照辦，避免事情繼續擴大。','你交出短刀，沉默地前往議事廳，沿路又聽見一些關於自己的傳聞。',{},'obey'],
['詢問能否先安排分糧，再問責。','鎮長遲疑，叫人把糧袋送往診療所。問訊照舊進行，但有人終於先吃上東西。',{food:1,trust:1},'foodFirst']
]},
{title:'議事廳的燈',time:'卯時 · 問訊',text:()=>p('議事廳裡，老倉丁、糧商、米拉和艾倫站在不同的燈影下。')+p(has('attackEli')?'艾倫遠遠望了你一眼，把頭轉開。':has('secretEli')?'艾倫走近一步，低聲問你是否還會替他保密。':'艾倫攥著手指，似乎有話想說。')+p(state.clues>=4?'你手上有幾條可以互相印證的線索，但每說出一條都可能牽連某個人。':'幾個人的說法並不一致，你還無法拼出完整的經過。')+p('鎮長把鑰匙放到桌上，問：「你希望大家先做什麼？」'),ask:'你提出的建議是：',opts:[
['先查清事故經過，任何人都不該立刻被定罪。','有人點頭，也有人仍然急著找出應受責罰的人。鎮長讓你逐一說明線索。',{clues:2,trust:1},'truth'],
['先找出失職者，否則沒有人會服氣。','幾個人喊著贊同，其他人開始互相指責。議事廳又吵了起來。',{trust:-1},'punish'],
['先處理傷者與糧食，問責延後。','幾個居民起身要幫忙，糧商卻要求先確定誰為損失負責。',{food:2,trust:1},'relief'],
['要求鎮長公開說明自己的決定，不該只問你。','鎮長沉默片刻。他必須回答，但其他人也在等你解釋守衛職責。',{trust:-1},'mayor']
]},
{title:'第四聲鐘',time:'卯時 · 破曉之前',text:()=>p('遠處傳來第四聲鐘，比預計早了一個時辰。')+p('一名披著濕斗篷的信使撞開大門：北邊木橋沖毀，原定黎明抵達的補給車不會來了。')+p('議事廳一片寂靜。有人喊著封住東門，不准再領糧；有人主張派人找渡船。')+p('你再次聽見自己的名字。這一次，他們不只是要你解釋昨晚去了哪裡。')+q('「你是東門的守衛。」一位婦人問，「那麼現在呢？」'),ask:'在天亮之前，你決定：',opts:[
['留下來，和居民一起安排剩餘糧食。','你走向糧袋，幾個人跟著站起來。但議事廳裡的指責並未停止。',{food:2,trust:1},'hearth'],
['拿出線索，要求先把這場火的真相查清楚。','你把查到的紀錄放在桌上。有人伸手接過，有人說你仍在替自己辯解。',{clues:2},'record'],
['去找艾倫與米拉，希望一起想辦法。','你穿過人群。他們沒有立刻回答，但也沒有離開。',{eli:1,mira:1},'companions'],
['走出議事廳，獨自去東門查看山路。','你退出人群，走入還未散去的霧。背後的燈火沒有熄。',{trust:-1},'gate']
]}
];
const ends={hearth:['灰燼旁的燈','天亮前，居民跟著你把麥袋搬進診療所。鎮長仍沒有撤回對你的調查。直到一碗熱粥送進孩子手裡，你才發現天已微亮。','還能撐幾天？誰來決定下一次分配？鐘聲再次響起時，東門傳來一封信。'],record:['留下的證詞','你將鑰匙、修繕紀錄和眾人的說法放上桌。它們無法立刻證明誰完全無辜，也不能讓飢餓的人吃飽。有人開始改口，有人更加憤怒。','鎮長宣布暫緩判決，要求你在日出後交出完整的夜間紀錄。信使在門外等候。'],companions:['三個人的沉默','你找到艾倫與米拉。三人站在燒焦的木樑旁，沒有人能說自己毫無過失。遠處的居民開始分糧，東門卻傳來哨聲。','艾倫突然說：「北路出事之前，我看見一輛沒有標記的車。」米拉抬起頭：「我也看見了。」'],gate:['霧中的東門','你走到東門，發現往北的路被急流截斷。木橋只剩繩索拍打著河岸。城裡仍有人在議論你。你扶著門柱，看見天際泛白。','對岸有人點起三盞燈，一明兩滅。那是守衛學過、卻多年沒用過的求援信號。']};
function code(){let n=0;for(let i=0;i<N;i++)n=n*4+state.picks[i];const a=n.toString(36).toUpperCase().padStart(4,'0'),b=((n*17+173)%1296).toString(36).toUpperCase().padStart(2,'0');return `MG1-${a}-${b}`}
function report(){return ['霧谷紀事｜第一夜','冒險者：'+(state.name||'守衛'),'結局：'+ends[state.ending][0],'承接碼：'+code(),'','這一夜的選擇',...state.history.map((h,i)=>`${i+1}. ${h.title}\n　${h.choice}`),'','結尾',ends[state.ending][1],ends[state.ending][2],'','這份紀錄沒有上傳伺服器。'].join('\n')}
function download(){const blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='霧谷紀事_第一夜_冒險紀錄.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function title(){app.innerHTML=`<div class="pane title-pane"><div class="kicker">A TINY STORY · EPISODE ONE</div><h1 class="hero">霧谷紀事<br>第一夜</h1><div class="lead">一把不該出現在火場的鑰匙。<br>一座即將耗盡糧食的城鎮。<br>一個必須在天亮前回答的問題。</div><div class="rule"></div><div class="help">故事會記得你的決定。不同的選擇，可能留下不同的關係與線索。</div><label class="label" for="nick">你的名字（選填）</label><input id="nick" class="name" maxlength="16" placeholder="你希望故事如何稱呼你？" value="${esc(state.name)}"><div><button id="start" class="primary">踏入霧谷　→</button></div><p class="help">約 15–20 分鐘｜繁體中文｜無需註冊</p><svg class="hero-art" viewBox="0 0 220 310" aria-hidden="true"><circle cx="160" cy="62" r="40" fill="#dbcaa4"/><path d="M0 220L45 165 76 189 110 132 150 150 220 110V310H0Z" fill="#a7b9ab"/><path d="M25 240V135h30V95h25v145h25V58h40v182h20V125h25v115h30v70H0Z" fill="#c4c9ae"/><path d="M0 265h220M72 260v-44h90v44M90 216l26-22 29 22" stroke="#f5dfb4" fill="none" stroke-width="4"/></svg></div>`;document.getElementById('start').onclick=()=>{state.name=document.getElementById('nick').value.trim().slice(0,16);state.screen='scene';save();render()}}
function scene(){const s=scenes[state.step];app.innerHTML=`<div class="pane scene"><div class="scene-top"><span>${esc(s.time)}</span><span>${String(state.step+1).padStart(2,'0')} / ${N}</span></div><h2>${esc(s.title)}</h2><div class="text">${s.text()}</div><div class="question">${esc(s.ask)}</div><div class="choices">${s.opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(o[0])}</span></button>`).join('')}</div><p class="help">故事將依照你的選擇繼續。完成後可重新遊玩。</p></div>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let idx=+b.dataset.i,opt=s.opts[idx];state.picks.push(idx);state.history.push({title:s.title,choice:opt[0]});boost(opt[2]);if(opt[3])state.flags.push(opt[3]);state.screen='result';save();render()})}
function result(){const s=scenes[state.step],o=s.opts[state.picks[state.step]];app.innerHTML=`<div class="pane scene"><div class="scene-top"><span>${esc(s.time)}</span><span>${String(state.step+1).padStart(2,'0')} / ${N}</span></div><h2>${esc(s.title)}</h2><div class="response">${esc(o[1])}<div><button class="primary" id="next">${state.step===N-1?'迎接黎明':'繼續故事'}　→</button></div></div></div>`;document.getElementById('next').onclick=()=>{state.step++;state.screen=state.step>=N?'ending':'scene';if(state.screen==='ending')state.ending=scenes[N-1].opts[state.picks[N-1]][3];save();render()}}
function ending(){let e=ends[state.ending]||ends.gate,echo=state.trust<0?'鎮上的人仍對你議論紛紛。':'有人願意把你說過的話再聽一遍。',bond=state.eli<0?'你和艾倫之間，還有一段話沒有說完。':state.mira>=2?'米拉終於願意告訴你更多細節。':'你還不知道艾倫與米拉會如何面對下一個白天。';app.innerHTML=`<div class="pane ending"><div class="kicker">EPISODE ONE · TO BE CONTINUED</div><h2>${esc(e[0])}</h2><p>${esc(e[1])}</p><p>${esc(echo)} ${esc(bond)}</p><p>${esc(e[2])}</p><div class="rule"></div><div class="help">第一夜完。這座城鎮的故事尚未結束。</div><div class="receipt"><div class="kicker">保留這一夜的冒險紀錄</div><p class="help">第三週的第二集將可以用承接碼接續這條路線。重新遊玩會創造另一段冒險。</p><div class="code" id="code">${code()}</div><div class="actions"><button class="secondary" id="copy">複製承接碼</button><button class="secondary" id="save">下載冒險紀錄</button><button class="secondary" id="again">重新遊玩</button></div><p id="message" class="help" aria-live="polite">承接碼記錄選擇路徑，不包含名字；紀錄沒有上傳到伺服器。</p></div><details><summary>回顧這一夜的選擇</summary><ol>${state.history.map(h=>`<li>${esc(h.title)}：${esc(h.choice)}</li>`).join('')}</ol></details></div>`;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code());document.getElementById('message').textContent='承接碼已複製。'}catch{document.getElementById('message').textContent='複製失敗，請長按上方承接碼手動複製。'}};document.getElementById('save').onclick=download;document.getElementById('again').onclick=openModal}
function render(){scrollTo(0,0);if(state.screen==='title')title();else if(state.screen==='scene')scene();else if(state.screen==='result')result();else if(state.screen==='ending')ending();else{state=blank();title()}}function openModal(){document.getElementById('modal').classList.add('open');document.getElementById('closeMenu').focus()}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('openMenu').onclick=openModal;document.getElementById('closeMenu').onclick=closeModal;document.getElementById('reset').onclick=()=>{state=blank();save();closeModal();render()};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// Encode each of ten decisions in two bits, for a portable continuation code.
window.FogValleyCarry={decode(text){const m=/^MG1-([0-9A-Z]{4})-([0-9A-Z]{2})$/i.exec(String(text).trim());if(!m)return null;let n=parseInt(m[1],36),test=parseInt(m[2],36);if(n>=4**N||test!==(n*17+173)%1296)return null;let picks=Array(N);for(let i=N-1;i>=0;i--){picks[i]=n%4;n=Math.floor(n/4)}return picks}};render();})();
</script></body></html>
