<script>
'use strict';const N={"opening":{"id":"opening","title":"序章｜十一分鐘","body":"那天晚上，你離開了十一分鐘。\n\n雨下到第四天，九點鐘聲剛過，鎮上的醫師冒雨衝進守衛室，「快去幫我拿藥！」\n\n「鎮長的小兒子燒到說胡話了。藥在鎮東門外的棚子，我這裡還有一個在縫傷口。」\n\n他袖口還沾著沒乾的血跡。才剛踏出守衛室的小門，又回頭補了一句：「鎮長說，別讓人知道有人發燒，大家要是以為有什麼瘟疫就亂了。」\n\n守衛的規矩，離崗要記在守衛記錄簿。你隨手記了一筆，時間九點，事由......這不好寫。算了，回來再補。\n\n你身上那把缺了一角的備用鑰匙，會不會跑著跑著就弄丟了？還是掛回左邊算來第二個銅鉤吧。\n\n十一分鐘。藥送到的時候，警鐘響了三聲。\n\n第一聲你以為有人落水。第二聲、第三聲……\n\n這是火警。\n\n# 一　火光裡的鑰匙","dice":[],"choices":[],"next":"fire","art":0},"fire":{"id":"fire","title":"一｜火光裡的鑰匙","body":"你從鎮東門外跑回來時，雨還沒停，糧倉的屋頂卻已經著了火。火是從帳房那一側竄上去的。雨打在瓦上，滋滋冒著白煙，壓不下去。\n\n倉前的空地擠滿了人，從井邊到倉門排成一列，一桶一桶往上潑。不知道誰先看見你，喊了一聲，整列人都回過頭來。人群在你面前讓出一條路。那條路不是讓你過去的，是讓大家看清楚「消失的守衛是哪個傢伙」。\n\n「側門怎麼開著？」「今晚誰值班啊？」「就他！」「現在才回來？」\n\n一個婦人提著空水桶，朝你腳邊砸下來。桶底裂了，泥水濺上你的褲管。「倉裡是全鎮過冬的麥子，你叫我家孩子冬天吃什麼？」\n\n鎮長從焦黑的木架後走出來。他滿臉煙灰，袍角燒掉一截，手裡舉著一把鐵鑰匙。\n\n跟在他後頭的是老倉丁。他在霧谷管了大半輩子糧倉，背已經駝了，腰上掛著一串鑰匙，走一步響一聲。哪一袋麥子哪天進倉、堆在第幾排，問他，他閉著眼睛都答得出來。鎮上的人買糧、借糧、還糧，都得先過他那本帳。\n\n老倉丁瞇眼看了看鎮長手裡那把，搶先開口：「這是糧倉側門的鑰匙，缺角那把。平常掛在守衛室，第二個銅鉤。」\n\n「我們趕到時，」鎮長說，「它就插在側門的鎖上。」\n\n「我九點出門的時候，它還掛在牆上。」\n\n「你出門？」\n\n四周的人互相看了一眼。守衛不得離崗，霧谷每個人都知道這條規矩。\n\n鎮長把鑰匙甩了甩，火光一路在鐵齒上閃爍。\n\n「告訴我，你為什麼要放火燒糧倉？」","dice":["你感到冤屈。","鎮長感到心急如焚。","老倉丁感到心神不寧。","提著空水桶的婦人感到絕望。","圍觀的人感到憤慨。","你感到百口莫辯。"],"choices":[{"label":"「放火的不是我。我是替醫師送藥。」","to":"fire_plain"},{"label":"「你憑什麼說是我？你自己不是也有鑰匙？」","to":"fire_fight"},{"label":"不回答，搶過水桶衝向側門。","to":"fire_rescue"},{"label":"先看著鑰匙，不在眾人面前回答。","to":"fire_silence"}],"art":1},"fire_plain":{"id":"fire_plain","title":"A｜當眾說明","body":"「放火的不是我。我是替醫師送藥。」\n\n「送藥？」旁邊有人立刻問了，「醫師不是在診療所幫那個摔倒的乞丐縫傷口，怎會找你送藥？」\n\n「醫師說他忙不過來。你可以直接問他。」\n\n鎮長握著鑰匙的手指收得死緊。旁邊有人插嘴：「什麼藥非得大晚上送，這麼急？」\n\n「先救火！」就在這時，一個滿臉灰的搬運工吼了一聲，「搬麥子的還在裡頭！」\n\n人群又急急忙忙散開，打水的打水，喊人的喊人。\n\n鎮長朝你使了個眼色。「你過來。」","dice":[],"choices":[],"next":"mayor","art":1},"fire_fight":{"id":"fire_fight","title":"B｜當眾反擊","body":"「你憑什麼說是我？你自己不是也有鑰匙？」\n\n你話才出口，人群就像等這一刻似的往前擠。\n\n「他還敢反問鎮長！」\n\n「有沒有放火，看誰在不在場，不是嗎？鎮長那時在家裡安撫他兒子，我還聽到小鬼哭得厲害。」另一個人說。\n\n鎮長沒有立刻答話。他把那把缺角的鑰匙捏在掌心，看向糧倉，朝大家喊「先救火，麥子燒光大家冬天就別過了！」\n\n人群又急急忙忙散開，打水的打水，喊人的喊人。\n\n「你先跟我到屋簷下，」鎮長靠近你，低聲說，「有些事我先問清楚。」","dice":[],"choices":[],"next":"mayor","art":1},"fire_rescue":{"id":"fire_rescue","title":"C｜先去救火","body":"「救火的人還在裡面，現在要先吵這個？」老倉丁吼了一聲。\n\n你沒答話。\n\n你扯過旁邊一個人的水桶，衝向側門。\n\n一根焦黑的屋樑從高處落下，砸在離你半丈遠的泥水裡。有人罵了聲髒話，拉住你的衣領。\n\n「別進去！搬麥子的都從後頭撤了！」\n\n你把水桶遞給後排的搬運工，回頭時，鎮長已經往屋簷走。\n\n他回頭朝你招手，握著鑰匙的手指收得死緊。","dice":[],"choices":[],"next":"mayor","art":1},"fire_silence":{"id":"fire_silence","title":"D｜保留言語","body":"你沒說話，鎮長把鑰匙舉得更高，像是要你看清楚缺角的那一側。\n\n出門時，左邊第二個銅鉤還晃了兩下。那個影像反覆在腦海裡咀嚼。\n\n「怎麼不說話！說不出來了是吧？」有人喊。\n\n一個搬運工從火場跑出來：「搬麥子的還在後頭！都別擋路！」\n\n人群又急急忙忙散開，打水的打水，喊人的喊人。\n\n鎮長讓開路，壓低聲音：「跟我過來。」\n\n# 二　鎮長與守衛室","dice":[],"choices":[],"next":"mayor","art":1},"mayor":{"id":"mayor","title":"二｜屋簷下的鎮長","body":"鎮長把你帶到屋簷的暗處，離人群十步，剛好聽不見，也剛好看得見。\n\n「孩子的事，別在這裡提。」\n\n「我是替你——」\n\n「我知道。」他頓了一下，「我知道。」\n\n呼喊聲、吵鬧聲中，又一根屋樑啪的一聲斷了。\n\n「可是鑰匙是從你守的地方出去的。這件事，你得給全鎮一個交代。」\n\n鎮長看著火場，沒有看你。握著鑰匙的手指收得更緊了。","dice":["鎮長感到左右為難。","你感到被出賣。","鎮長感到疲憊不堪。","你感到不甘心。","鎮長感到害怕。","你感到孤立無援。"],"choices":[{"label":"「那你就跟大家說，醫師確實找過我。」","to":"mayor_public"},{"label":"「孩子的事，我不說。但你也別說我放了火。」","to":"mayor_private"},{"label":"「天亮前，我會查清楚誰動了鑰匙。」","to":"mayor_inquiry"},{"label":"「既然你知道，就請你讓我回去救火。」","to":"mayor_work"}],"art":2},"mayor_public":{"id":"mayor_public","title":"要求公開作證","body":"「那你就跟大家說，醫師確實找過我。」\n\n鎮長終於轉過頭。\n\n「你要我站到火堆前，跟全鎮說醫師大晚上找守衛跑腿？」他說，「下一句他們就要問：跑去哪？送什麼？給誰？」\n\n「他們問，醫師可以答。」\n\n「醫師答得出來的，只有他叫你去。」鎮長把鑰匙翻過來，缺角朝上，「鑰匙什麼時候離開銅鉤，他答不了，我也答不了。」\n\n雨從瓦溝滴下來，落在你們中間。\n\n「等火壓下來，我去找醫師，把話對好。」他說，「到議事廳以前，你一個字也別提。」\n\n「對好？」\n\n鎮長沒有回答。火場那頭有人喊他，他把鑰匙收進外套，走了兩步，又回頭：\n\n「守衛室你最熟。去看看，這把鑰匙是怎麼出門的。」","dice":[],"choices":[],"next":"guardroom","art":2},"mayor_private":{"id":"mayor_private","title":"交換保密","body":"「抱歉，」鎮長將鑰匙放進外套口袋，幽幽地說：「我說話太急了。」\n\n他站著不動，外面有人叫他名字。救火的人還在大呼小叫，該睡覺的小孩也都全跑出來圍觀，有的光著腳，被大人一把拎回屋簷下，又從另一頭溜出去。\n\n平靜的夜雨，天翻地覆的人心。\n\n「可是沒辦法，天亮前，還是得把鑰匙的事查清楚。」\n\n他走回火光裡，腳步比來時快，顯得有些踉蹌。叫他名字的是老倉丁，站在倉門口，兩隻手都是黑的。\n\n你一個人留在屋簷下。一個扛著空桶的搬運工從旁邊經過，放慢了腳步，看看你，又看看鎮長的背影，才走開。\n\n守衛室在石子路對面，門口那盞燈不知什麼時候熄了。","dice":[],"choices":[],"next":"guardroom","art":2},"mayor_inquiry":{"id":"mayor_inquiry","title":"要求調查鑰匙","body":"「你出門多久？」鎮長問。\n\n「十一分鐘。藥送到，警鐘就響了。」\n\n「十一分鐘。」鎮長說，「你說你只去了十一分鐘，誰會那麼剛好知道鑰匙在那裡？」\n\n「不知道。」你說。\n\n鎮長看了你一眼，那個表情說明了他不以為然。\n\n「不知道，那就去查。」他把鑰匙端詳了一下，又放進外套口袋，「天亮前，要給我一個能查證的說法。我不能沒材料講給大家聽。」\n\n火場裡有人搬出一袋濕麥子，袋底開了，麥粒散成一地。是老倉丁。他跪在泥水裡，想用手把麥粒攏回袋口，攏了幾把，又停下來。雖然看不清楚神情，但那個嘆氣聲，聽起來有些哀怨。\n\n鎮長走過去，抓著他的胳膊把他拉起來，兩個人都沒說話。\n\n你轉身穿過傳水的人龍，往石子路對面的守衛室走去。","dice":[],"choices":[],"next":"guardroom","art":2},"mayor_work":{"id":"mayor_work","title":"返回救火","body":"「不管了，先把這火勢搞定。」鎮長指著東邊的人群。「去那裡搬水。不要碰側門，等人把屋頂支起來。」\n\n人龍從井邊一路排到倉牆底下，一個打水，一個接，一桶一桶往前傳。側門那頭，幾個木匠扛著長梯和木柱，要把塌了一半的屋簷撐住。\n\n你快步走過去，被排到最前頭，靠倉牆那一端，熱氣燙得人睜不開眼。你和搬運工輪著拎桶，一桶又一桶，機械性的動作，一次又一次，連胳膊痠得像是不長在自己身上，都沒發現。\n\n有人認出你，好像要說什麼又止住了，順手就將自己的水桶也塞過來；還有人替你扶住差點沒抓到的繩頭。就這樣，沒有人分得清是汗水還是雨水，總算把這場火壓下來。\n\n天快亮了，帳房那一角只剩黑煙。救火的青壯累癱在各個角落喘氣，有人靠著倉牆就睡著了。鎮長和老倉丁站在倉門口，一邊說話，一邊點著搬出來的麥袋，沒有往你這邊看。\n\n你無聲走回守衛室，鞋底積著厚厚一層黑泥。","dice":[],"choices":[],"next":"guardroom","art":2},"guardroom":{"id":"guardroom","title":"二｜守衛室","body":"門虛掩著。你出門時明明帶上了。\n\n第二個銅鉤空著，泥地上幾個沒乾透的腳印，鞋尖朝牆。\n\n傍晚艾倫端來的湯，擱在守衛記錄簿旁，冷湯上還浮著一層油。這種一直下雨的鬼天氣，大概也只有艾倫這種兄弟會端湯來守衛室給你。\n\n在你之前，艾倫做過兩年糧倉守衛，後來說要去學做生意，就換成你來守了。可大概是運氣不好，艾倫跟糧商處不來，又弄壞人家的東西，結果就落得整天在村裡閑晃，好聽一點是「思考下一步」，難聽就是「遊手好閒」。\n\n「別睡著。」你還記得，艾倫罵完老天、老鎮、老倉丁跟所有老舊的東西之後，離開時丟給你一句。你是沒睡著，但糧倉還是出事了。\n\n就在你盯著那空蕩蕩的銅鉤發呆時，屋外傳來人喊：「井邊還有燙傷的，快拿乾布！」","dice":["你感到困惑。","你感到被人算計。","你感到心慌。","井邊喊乾布的人感到焦急。","你感到懊惱。","想起艾倫，你感到不解。"],"choices":[{"label":"先看守衛記錄簿和門邊的腳印。","to":"guard_inspect"},{"label":"去井邊找艾倫。他比誰都熟悉守衛室。","to":"guard_eli"},{"label":"把鑰匙架與門的情況記下，留給鎮長。","to":"guard_report"},{"label":"井邊在要乾布。先抱守衛室的布過去。","to":"guard_help"}],"art":3},"guard_inspect":{"id":"guard_inspect","title":"檢查守衛記錄簿","body":"你沒理會。現在還是得先搞清楚鑰匙是怎麼回事。鎮長那個樣子，就算肯替你說話，也說不了多少。\n\n你把門推開到底，讓外頭的光透進來。守衛室不大，一張木桌、一條長凳、一盞油燈，左邊牆上一排五個銅鉤。油燈早滅了，燈芯焦成一截黑頭。你摸出火石，打了三次才點著。\n\n你蹲在門後看了半天。腳印從門口進來，直直走到銅鉤底下，鞋尖朝牆，再轉身出去。鞋印的邊緣還沒被雨踩平，比你的鞋大一點，鞋底的紋路卻糊成一片，辨不出是誰的。\n\n守衛記錄簿攤在桌上，翻在今晚那一頁。只有你留下的那一行：「離開：九點，事由：........」，沒有新的字，也沒有被翻動過。你看向那碗冷湯，油花凝在碗邊，湯匙還插在裡頭。這好像也不能證明什麼。\n\n你站起來看那排銅鉤。第一個掛著正門的備用鑰匙，第三、第四個掛著鐘樓和水閘的，第五個空了很久。只有第二個被扯歪了，鉤尖朝外翻，像是拿的人來不及把鑰匙從鉤子上提起來，直接連鉤一起扯。\n\n看起來拿鑰匙的人很急。急著去放火嗎？\n\n你把銅鉤掰直，心裡想著，還有誰會知道側門鑰匙掛在這裡？究竟是誰跟你過不去？\n\n窗外，一個婦人抱著一疊布，從石子路上跑過去，邊跑邊喊：「艾倫！艾倫你別動，布來了！」\n\n你走到窗邊。井欄旁圍了一圈人，中間那個寬肩膀的背影，你從小看到大。那是艾倫。\n\n這怎麼回事，得問清楚。","dice":[],"choices":[],"next":"well","art":3},"guard_eli":{"id":"guard_eli","title":"立刻找艾倫","body":"你沒再看那碗湯。\n\n守衛室這扇門、那排銅鉤、側門鑰匙該掛在第幾個，霧谷知道的人沒幾個。艾倫守過兩年，閉著眼睛都摸得到。\n\n你帶上門，走進雨裡。\n\n石子路上全是泥，混著踩爛的麥殼。倉那頭還冒著煙，路邊坐著幾個累垮的人，有個搬運工蹲在水溝旁吐黑水。你往井邊走，一路上有人認出你，往旁邊讓開；也有人偏不讓，肩膀硬撞過來。\n\n「守衛又要去哪？還想跑啊？」\n\n你沒停下來。\n\n井在倉前空地的東角，一圈石欄，旁邊立著轆轤，平常是婦人洗菜的地方。今晚井邊擠滿了燙傷的人，有人拿濕布摀著臉，有人坐在地上，讓別人一瓢一瓢往背上澆水。醫師不在，替他們包紮的是兩個搬運工的老婆，布不夠用，撕的是自己的圍裙。\n\n井欄最裡頭，靠著木桶蹲著一個背影。肩膀很寬，頭髮濕成一綹一綹，身上還是傍晚來守衛室時那件灰外套，右邊袖口焦了一圈。\n\n你走過去。他聽見腳步聲，沒回頭。\n\n「火滅了沒？」","dice":[],"choices":[],"next":"well","art":3},"guard_report":{"id":"guard_report","title":"留下紀錄","body":"你把油燈重新點著，拉開長凳坐下，翻開守衛記錄簿。今晚那一頁只有一行，是你自己的字：「離開：九點，事由：........」\n\n你蘸了墨，在下面補了一行：九時後，有人進入守衛室，側門備用鑰匙離架。\n\n沒有名字，也沒有猜測。寫給誰看，你心裡也很茫然。鎮長？明天議事廳裡那一屋子的人？還是哪天換別人來守這間屋子，翻到這一頁，會知道今晚不只你一個人進來過？\n\n墨還沒乾，你吹了兩口氣。\n\n那碗冷湯就擱在簿子旁邊，油花凝在碗邊，湯匙還插在裡頭。它一定見過偷鑰匙的人吧？\n\n把筆擱回去時，你看到第二個銅鉤被扯歪了，鉤尖朝外翻。門邊的泥地上，有一條新鮮的泥痕，從門檻斜斜劃開，像有人一進門就急著轉身往外跑。\n\n偷鑰匙的人看來很急。誰會急著去放火燒倉庫？\n\n你把守衛記錄簿合上，壓在油燈底下，免得被風吹開。\n\n外面傳來呼喊聲，就在井那頭：「艾倫，你看看你的手，怎麼燒成這樣！」\n\n這得問清楚。你一邊思忖，一邊跨出了守衛室。","dice":[],"choices":[],"next":"well","art":3},"guard_help":{"id":"guard_help","title":"送乾布去井邊","body":"井邊那聲喊又來了一次，比剛才更急。\n\n你拉開牆角的木櫃，值夜用的粗毯、擦燈的乾布都收在裡頭。你抱了一大疊，用肩膀頂開門。\n\n石子路上全是泥。一個扛著空桶的人看見你懷裡的布，伸手就要，你分了兩條給他。他看清是你，愣了一下，還是把布接過去，什麼也沒說。\n\n井在倉前空地的東角，一圈石欄，旁邊立著轆轤，平常是婦人洗菜的地方。今晚井邊擠滿了燙傷的人，有人拿濕布摀著臉，有人坐在地上，讓別人一瓢一瓢往背上澆水。替他們包紮的是兩個搬運工的老婆，布不夠用，撕的是自己的圍裙。\n\n「布來了！」有人喊。好幾隻手同時伸過來。\n\n你一條一條遞出去，遞到最後一條，是井欄最裡頭伸過來的一隻左手。那人的右手還泡在木桶裡，灰外套的袖口焦了一圈。\n\n你順著那隻手看上去。\n\n是艾倫。\n\n他接過布，沒看你。\n\n「火滅了沒？」\n\n# 三　井邊的手","dice":[],"choices":[],"next":"well","art":3},"well":{"id":"well","title":"三｜井邊的手","body":"艾倫比你大兩個月，從小就比你高，跑得也比你快。小時候兩人去鐘樓後頭偷摘梨，他先翻牆跑了，被抓到的總是你。\n\n你在他旁邊蹲下。他的右手泡在木桶裡，袖口焦了一圈，水面漂著一片燒黑的布。\n\n「還在冒煙。」你說，「麥子燒掉一大半。」\n\n艾倫盯著水面，沒說話。旁邊一個婦人抓著孩子的手背在吹，孩子哭一聲，她就罵一聲：「叫你別靠近，叫你別靠近！」\n\n轆轤上掛著一盞燈籠，被雨打得一晃一晃。井邊這些人，燙到的是臉、是背、是潑水時濺到的手臂。只有艾倫，一直把整隻手掌按在水裡。\n\n「側門是開的。」你壓低聲音，「有人從那裡進去過。」\n\n艾倫的手在桶裡動了一下，又按回去。\n\n「你的手，是抓了什麼燙成這樣的？」\n\n他還是沒抬頭。井那頭有人在喊誰的名字，喊了兩聲，沒人應。\n\n「你拿了鑰匙？」\n\n「是我拿的。」他說，「鐘一響，我就在附近。倉裡有人在拍門，一下一下，跟打鼓似的。我只好去你那裡拿。」\n\n「鑰匙為什麼留在鎖上？」\n\n「有人喊屋頂要塌，我衝進去拉人，還管什麼鑰匙。」\n\n他抽出右手。手心腫得發亮，皮皺成一片，五根手指合不攏。\n\n「你去跟鎮長講側門是我開的，明天全鎮就說火也是我放的。」\n\n他把手又放回水裡，哼了一聲，但說話的聲音更低了。\n\n「賀維，那個跑北路的糧商，他那副車架，我到現在還沒賠。這回再扯進糧倉，你說，我拿什麼賠？」","dice":["艾倫感到害怕。","艾倫感到走投無路。","你感到被背叛。","你感到心軟。","抱著孩子的婦人感到心疼。","艾倫感到抬不起頭。"],"choices":[{"label":"「這件事我先不說。」","to":"eli_hide"},{"label":"「你是在救人。明早我們一起去說。」","to":"eli_together"},{"label":"「你拿走我的鑰匙，倒叫我替你扛？」","to":"eli_attack"},{"label":"「你究竟救了誰？屋裡還有人嗎？」","to":"eli_question"}],"art":4},"eli_hide":{"id":"eli_hide","title":"保護艾倫","body":"「這件事我先不說。」\n\n艾倫的肩膀鬆了下來。他把手從水裡抽出來甩了甩，水珠甩到你臉上。\n\n「我就知道。」他說，「全霧谷，就你夠兄弟。」\n\n「鎮長要我天亮前給個交代。」\n\n「那你就說不知道。」艾倫把燒焦的袖口往下拉，蓋住手背，「你本來就不知道。我去拿鑰匙的時候，守衛室連個鬼都沒有。」\n\n「那鑰匙呢？」\n\n「鑰匙長了腳，自己走過去的。」\n\n他說得很快，眼睛沒有看你，看著井裡。\n\n旁邊替人包紮的婦人抬頭，往你們這邊看了一眼。艾倫立刻閉上嘴。等她又低下頭，他才開口，聲音壓得只剩一口氣：\n\n「回頭我請你喝酒。」\n\n他起身的時候晃了一下，用左手撐住井欄。","dice":[],"choices":[],"next":"eli_after","art":4},"eli_together":{"id":"eli_together","title":"邀艾倫同行作證","body":"「你是在救人。明早我們一起去說。」\n\n「一起去？」\n\n艾倫用腳尖踢了踢倒在地上的水桶，水桶滾了半圈，停在一灘泥裡。\n\n「你說救人，誰信？救了誰？人在哪？」\n\n「總有人看見你從側門出來。」\n\n「看見我從側門出來，跟看見我從側門進去，差在哪？」\n\n「好，要說一起說。」他把手按回水裡，「我去拿鑰匙的時候，守衛室連個鬼都沒有。你先說你那時候去了哪、替誰跑腿，我再說我開門是去救誰。」\n\n你沒有答話。\n\n艾倫看了你一會兒。\n\n「你看，你自己也有不能說的。」\n\n井那頭有人在叫搬木料的人手。艾倫沒有動，你也沒有動。\n\n「天亮，鐘樓底下。」他終於說，「你別又不見人影。」","dice":[],"choices":[],"next":"eli_after","art":4},"eli_attack":{"id":"eli_attack","title":"責怪艾倫","body":"「你拿走我的鑰匙，倒叫我替你扛？」\n\n你的聲音比你想的大。抱著孩子的婦人停下來，看了你們一眼。\n\n艾倫把右手從水裡抽出來，藏回袖口。\n\n「我衝進去救人，你倒先查起我了。」\n\n「你拿鑰匙沒說。」\n\n「你離崗也沒問過我。」\n\n他站起來。他比你高半個頭，從小就是這樣，站起來就擋住你頭上那盞燈籠。\n\n「從小到大，被抓到的總是你。」他說，「這次換我，好不好？」\n\n他沒等你回答，捧著那隻手，從井欄另一頭繞出去，擠進搬木料的人堆裡。\n\n剛才那個婦人還在看你。過了一會兒，她低下頭，跟旁邊的人說了句什麼，那人也抬起頭來。","dice":[],"choices":[],"next":"eli_after","art":4},"eli_question":{"id":"eli_question","title":"先問救援細節","body":"「你究竟救了誰？屋裡還有人嗎？」\n\n「黑漆漆的，誰看得清。」\n\n艾倫把燒焦的袖口翻到外面。布上有一道細細的刮痕，像被指甲抓過。\n\n「她喊了一聲，我就拖著人從側門出來。剛出來，後頭的屋樑就塌了。」\n\n「她？」\n\n艾倫把袖子捲回去。\n\n「我把人放在磨坊那邊的屋簷下，回頭去提水，人就不見了。」他說，「你明天去問問，是哪個傢伙晚上不睡覺卻躲在糧倉，不就知道了？」","dice":[],"choices":[],"next":"eli_after","art":4},"eli_after":{"id":"eli_after","title":"共同節點｜艾倫扛木頭","body":"搬木料的人手不夠，艾倫還是去了。\n\n你遠遠看著他。側門那頭塌下來的屋簷要撐住，得有人把長木柱扛到倉牆底下。別人兩個扛一根，他一個人扛，用左肩頂著，右手垂在身側，袖口還在滴水。\n\n「艾倫，你那隻手！」一個搬運工喊。\n\n「死不了。」\n\n木柱扛到一半，他腳下一滑，整根砸進泥裡。他跪在泥水裡，伸右手去抓，抓了一下就鬆開了。\n\n搬運工過去要扶，他把人推開，自己用左手撐著站起來，又彎腰去抬那根木頭。\n\n「手爛了正好。」他說，「爛了，就沒人叫我賠車架了。」\n\n沒有人接話。\n\n巷口跑過幾個孩子，扯著嗓子喊：「抓到放火的啦！」「抓到放火的啦！」\n\n艾倫把木柱扛上肩，沒有回頭看他們。\n\n從小到大，他一直是跑得比較快的那一個。這一次，他走得很慢。\n\n鐘樓旁有人喊：「糧倉壓住了半邊，能撈的麥子先撈！」\n\n# 四　帳房與老倉丁","dice":[],"choices":[],"next":"granary","art":4},"granary":{"id":"granary","title":"四｜不該有的油味","body":"天亮了。火已經壓下去，糧倉燒掉半邊屋頂，剩下那半邊靠幾根新撐上去的木柱頂著。雨從破洞直直落進來，麥袋泡在黑水裡。搬運工排成一列往外撈，每撈起一袋，老倉丁就報一個數字，數字一個比一個小。\n\n糧倉是長長一棟，正門對著倉前空地，帳房就在正門邊上，記帳、收單、點燈都在那間小屋裡。側門開在另一頭，靠著後巷。麥袋一排一排堆在中間，帳房和麥袋之間隔著一扇防火的厚木門。\n\n火是從帳房燒起來的。那扇厚木門歪在框上，一個搬運工拿鐵棍撬到一半，扔下棍子。\n\n「不用撬了！釘腳早斷了。前天我就貼了修閂的字條，貼給鬼看！」\n\n焦味底下有股甜膩的油味。帳房牆邊歪著幾個鐵桶，一個裂了口，旁邊黏著燒成黑炭的粗布。\n\n「帳房哪來這麼多油？」搬運工問，「平常不就一小壺，添燈用的。」\n\n另一個搬運工四下看了看：「米拉呢？平常這時候，那丫頭早拿著帳本在點袋子了。」\n\n米拉是老倉丁收的學徒，十五歲，記帳記得比誰都細。\n\n老倉丁從倒塌的木架後走出來。\n\n「先搬麥子！要在這裡查案，等全鎮餓死了再查。」","dice":["撬門的搬運工感到氣憤。","老倉丁感到焦躁。","你感到起疑。","問起米拉的搬運工感到擔心。","你感到震驚。","老倉丁感到不耐煩。"],"choices":[{"label":"走到油桶旁，查看燒焦的布與門閂。","to":"granary_oil"},{"label":"當面問老倉丁：油是誰搬進來的？","to":"granary_pressure"},{"label":"先替搬運工搶救還能用的麥袋。","to":"granary_grain"},{"label":"去翻帳房的登記簿，看昨晚還有誰進來。","to":"granary_book"}],"art":5},"granary_oil":{"id":"granary_oil","title":"查看油桶與門閂","body":"你從側門進去。鎖舌完好，沒有撬過的痕跡，鑰匙孔邊上有一圈新的黑手印。開這扇門的人，是拿鑰匙開的。\n\n麥袋中間踩出一條泥路，一直通到正門那頭。越往帳房走，腳下的水越黑，油味越重。\n\n帳房那道厚木門跟側門不一樣。它不用鑰匙，只靠一根門閂扣緊。門閂還橫在那裡，可是固定門閂的釘腳斷了，整根歪向一邊，門板一推就晃。這扇門本來是要把火關在帳房裡的。\n\n你跨進帳房。帳桌倒了，油燈摔在地上，燈罩碎成好幾片。牆邊四個鐵桶，三個還立著，一個裂了口，倒在一灘黑油裡。你蹲下去，用手指沾了一點搓開，滑的，不是水。\n\n桶耳上綁著一截麻繩，燒掉一半，剩下那截是藍色的。\n\n帳桌底下，黑灰裡有半個腳印，很小，比你的手掌長不了多少。\n\n你拾起桶邊那塊焦黑的粗布。布角還沒燒透，摸起來硬硬的，浸滿了油。\n\n「別碰那些油桶！」老倉丁在門口喊，「能搬的先搬出去！」\n\n他沒有走進來，就站在那扇歪掉的門外頭。","dice":[],"choices":[],"next":"keeper","art":5},"granary_pressure":{"id":"granary_pressure","title":"直接問老倉丁","body":"你走到老倉丁旁邊。他蹲著在綁一袋濕麥子的袋口，繩子在手裡繞了兩圈。\n\n「油是誰送來的？」\n\n「白天貨進貨出，什麼東西不暫放？」\n\n「暫放在帳房？」\n\n老倉丁沒抬頭。繩結打了兩次都沒打上，第三次，繩頭從他手裡滑了出去。\n\n「你知道有油。」\n\n他站起來，把那袋麥子往你腳邊一推。袋子倒了，濕麥粒從袋口漏出來。\n\n「你到底要救麥子，還是要救自己的名聲？」\n\n旁邊的搬運工都停了手。一個年輕的搬運工張了張嘴，像要說什麼，被身邊的人用手肘頂了一下，又閉上了。\n\n老倉丁彎腰把袋子扶起來，往磨坊那邊看了一眼，才又低頭綁繩。","dice":[],"choices":[],"next":"keeper","art":5},"granary_grain":{"id":"granary_grain","title":"搶救麥袋","body":"你捲起袖子，跟搬運工一起下到黑水裡。\n\n麥袋泡了水，一袋重得像兩袋。你們兩個人抬一袋，從側門抬出去，排在倉前的空地上。有人喘著氣說，上面這層還能曬；另一個人一摸袋底，整把麥子散成了糊。\n\n「這袋不行。」\n\n「這袋也不行。」\n\n老倉丁走過來，從你手裡接過繩頭，替你打了個結。他的手很穩，一股煙味。\n\n「能曬的先擺去磨坊，別跟燒穿的混在一起。」他說，「米拉那邊有地方。」\n\n說完，他自己先頓了一下。\n\n你扛起最後一袋，經過帳房門口時，聞到裡頭飄出來的油味，比焦味還重。你往裡頭看了一眼。\n\n老倉丁也看見了。他朝外頭喊：「空車呢？推過來！先把這排裝走！」","dice":[],"choices":[],"next":"keeper","art":5},"granary_book":{"id":"granary_book","title":"檢查登記簿","body":"帳房的門歪著，你側身擠進去。\n\n帳桌倒在地上，抽屜摔開，紙全泡在黑水裡。你在桌腳底下找到一本登記簿，封皮燒焦了，前面幾頁黏成一團，揭不開，最後一頁倒是完好。\n\n這一頁是昨天的帳。字很小，很整齊，一筆一畫端端正正，不是老倉丁那手歪歪斜斜的字。記到一半，下面空了七行。\n\n空白那七行的第一行頭上，有一個墨點，又圓又深，像筆尖在那裡停了很久。\n\n你把簿子拿到門口的光底下。\n\n「這些是倉裡的帳，別弄壞了。」老倉丁走過來，伸手就要抽走。\n\n你沒鬆手。\n\n「這是誰的字？」\n\n老倉丁的手停在半空。旁邊一個搬運工探頭看了一眼：「米拉的字嘛。那丫頭寫字，比師父好看多了。」\n\n老倉丁把簿子從你手裡抽走，夾到腋下。","dice":[],"choices":[],"next":"keeper","art":5},"keeper":{"id":"keeper","title":"四｜老倉丁","body":"老倉丁腰上那串鑰匙，你見過不下百次：正門、帳房、木櫃，三把。他走一步，鑰匙響一聲，全倉的人聽聲音就知道師父來了。\n\n今天他走起路來，只響兩聲。\n\n你等搬運工扛著麥袋走遠了，才開口。\n\n「米拉昨晚來過？」\n\n老倉丁的手停住了。\n\n「她一個孩子，」他說，「懂個屁。」\n\n一個搬運工從側門外探頭進來：「師父，米拉的手燙得不輕，包了兩層布還在滲水——」\n\n「誰叫你在這裡嚷嚷的？」老倉丁沒回頭，「搬你的麥子。」\n\n搬運工縮回頭去。","dice":["老倉丁感到難堪。","老倉丁感到擔心米拉。","你感到不耐煩。","你感到起疑。","探頭的搬運工感到委屈。","老倉丁感到喘不過氣。"],"choices":[{"label":"「你明知道油桶不該放帳房。」","to":"keeper_accuse"},{"label":"「米拉在哪？我先去問她。」","to":"keeper_mila"},{"label":"「門閂的字條是誰寫的？你見過嗎？」","to":"keeper_door"},{"label":"「剩下的麥子得先救。你告訴我要搬哪幾袋。」","to":"keeper_work"}],"art":5},"keeper_accuse":{"id":"keeper_accuse","title":"指出違規","body":"「你明知道油桶不該放帳房。」\n\n「誰說油桶是我放的？」\n\n「我沒說是你放的。」\n\n老倉丁把臉轉向一邊，忽然又轉回來。\n\n「那你這樣問，是要我扛？又不是我放火的。」他往前走了一步，腰上的鑰匙響了一聲，「你守的那扇門，你自己都不在。」\n\n旁邊兩個搬運工放下麥袋，站著不走了。\n\n「那是——」老倉丁開了口，又停住。他看了一眼那排焦黑的鐵桶，把後半句吞了回去。\n\n遠處有人在喊米拉的名字，喊了兩聲。喊聲是從磨坊那頭傳來的。\n\n他咬著牙，拎起一袋濕麥子，從你身邊擠過去。","dice":[],"choices":[],"next":"mill","art":5},"keeper_mila":{"id":"keeper_mila","title":"先問米拉","body":"「米拉在哪？我先去問她。」\n\n「磨坊外頭。」老倉丁說，「她應該在那兒。」\n\n「你不去看看？」\n\n老倉丁把繩子打了死結，用力一扯，繩頭勒進他自己的手指。\n\n「我現在一走，這些糧誰點？」\n\n他沒看你，將一袋濕麥子推上車。推完了，他站在車邊，背對著你。\n\n「叫她手泡冷水，泡到不痛為止。」他說，「別說是我說的。」","dice":[],"choices":[],"next":"mill","art":5},"keeper_door":{"id":"keeper_door","title":"追問修閂字條","body":"「門閂的字條是誰寫的？你見過嗎？」\n\n「前天搬運工留過紙，」老倉丁說，「我知道。」\n\n「那道門是防火用的。」\n\n「鐵匠困在南村，雨下成這樣，路都斷了。你叫我拿什麼修？拿手指頭釘？」\n\n他說話的時候，右手一直攥著一團紙，揉得皺巴巴的，泡過水，墨跡暈開了，只看得出一個「閂」字。\n\n你看著那團紙。他把手背到身後去。\n\n他像是要說別的，卻又看了一眼那些油桶。\n\n「先搬麥子。」他說，「米拉在磨坊，搬完這排，你替我去看看她。」","dice":[],"choices":[],"next":"mill","art":5},"keeper_work":{"id":"keeper_work","title":"一起救糧","body":"「剩下的麥子得先救。你告訴我要搬哪幾袋。」\n\n老倉丁看了你一眼，伸手一指：「靠牆那兩排，上頭幾層沒泡到。底下的別碰，一碰就散。」\n\n你們一趟一趟搬，泥水灌進鞋子裡。老倉丁搬得不比搬運工慢，每搬一袋，就報一個數字，你在心裡跟著記。報到後來，他的聲音越來越小。\n\n最後一袋扛上車時，他拿袖子抹了把臉。\n\n「米拉在磨坊。你去看看她吧。」\n\n「你呢？」\n\n「我把這裡點完。」他停了一下，「跟她說，先把手處理好，我還要等著她寫帳本。」\n\n# 五　米拉與七行","dice":[],"choices":[],"next":"mill","art":5},"mill":{"id":"mill","title":"五｜七行","body":"往磨坊的巷子裡，晾衣竿底下站著幾個婦人，壓低了聲音在說話。\n\n「火場裡拖出來一個，你看見沒？從側門。」\n\n「看見了，小小一個，頭髮都燒捲了。」\n\n「倉裡那個學徒丫頭吧？今天一早就沒人見著她。」\n\n她們看見你走過來，就不說了。\n\n上個月，師父當著搬運工的面罵米拉，說她連袋數都數不清。當天全倉聽見，第二天全鎮知道。從那以後，她記帳記得比誰都細。\n\n你在磨坊外的石階上找到她。她縮在屋簷底下，兩手纏著白布，布底滲出淡黃的水。\n\n「師父說什麼了？」她先問。\n\n「妳怕他說什麼？」\n\n「……說我又做錯了。」她盯著石縫裡一根草，「帳少對了七行。少一行，他就要罵一次。」\n\n她從懷裡掏出一把鑰匙，放在石階上。是正門的。\n\n「我等他睡了才拿。想說抄完就放回去。」\n\n「帳房裡有什麼？」\n\n「好黑。我摸著牆走，撞到幾個桶。空的吧，我以為。」她說，「昨天下午師父叫我去磨坊對帳，我回來的時候，帳房的門都關了。」\n\n「然後呢？」\n\n「我點了燈。袖子一掃——」\n\n她的手抬起來，像要把什麼東西扶住，抬到一半，停在半空。\n\n「那塊布是臭的，不是燒焦那種臭。它燒得比我的手還快。火在門口那邊，我只能往裡頭跑，跑到側門，門是鎖的。」\n\n「誰開的門？」\n\n「不知道。太亮了，又全是煙。有人抓著我的手臂往外拖，把我放在這裡，就走了。」\n\n她把手收回膝蓋上。\n\n「那些油，不是我搬進去的。」","dice":["米拉感到害怕。","米拉感到委屈。","你感到心疼。","你感到兩難。","米拉感到無地自容。","巷口議論的婦人感到好奇。"],"choices":[{"label":"「妳說那些油不是妳搬的，我聽見了。」","to":"mira_listen"},{"label":"「但妳明知道晚上不能進去。妳打算怎麼說？」","to":"mira_press"},{"label":"「先別提火。手傷得這麼重，醫師看過沒？」","to":"mira_care"},{"label":"「帳本上的七行，為什麼非得今晚寫完？」","to":"mira_seven"}],"art":6},"mira_listen":{"id":"mira_listen","title":"認真聆聽","body":"「妳說那些油不是妳搬的，我聽見了。」\n\n米拉沒抬頭，看了看手上的白布。\n\n「我在那裡做了快一年，從沒看過帳房裡擺那麼多桶子。」\n\n「妳看清楚了？」\n\n「沒有，太暗。我還以為是空桶。」她停了一下，「要是空的就好了。」\n\n一個婦人端著水盆從巷口走過來，經過石階時慢下腳步，眼睛落在米拉那兩隻包著白布的手上。\n\n「手包成那樣……」她說，「就是她吧？晚上偷進糧倉那個。」\n\n婦人走遠了。米拉把手縮進袖子裡，白布勾住了袖口，她扯了兩下才扯進去。\n\n「那些油不是我搬進去的。」她說，聲音比剛才小。","dice":[],"choices":[],"next":"mira_after","art":6},"mira_press":{"id":"mira_press","title":"追究夜間入倉","body":"「但妳明知道晚上不能進去。妳打算怎麼說？」\n\n「我知道不能去。」米拉說。\n\n「那妳還去？」\n\n「我……」\n\n一個婦人端著水盆停在巷口，眼睛落在米拉那兩隻包著白布的手上。\n\n「手包成那樣……」她說，「就是她吧？晚上偷偷進糧倉那個。」\n\n又有兩個人從磨坊那頭走過來，站到婦人旁邊。沒有人說話，就那樣站著。\n\n米拉把鑰匙抓回掌心，攥得白布都起了皺。她看看巷口那幾個人，又看看你。\n\n「你要說就去說。」\n\n她的聲音比剛才小。","dice":[],"choices":[],"next":"mira_after","art":6},"mira_care":{"id":"mira_care","title":"先照顧傷勢","body":"「先別提火。手傷得這麼重，醫師看過沒？」\n\n「醫師忙著救別人。」米拉說，「我去排過隊，前面還有四個，我就回來了。」\n\n她把手藏進袖子，卻被白布勾住，露出一截紅腫的手腕。\n\n你在她旁邊坐下，從懷裡取出一塊乾淨的布，放在石階上。\n\n她看了很久，才伸手去拿。\n\n「我真沒見過那些油桶。」她說，聲音小到像是跟自己說的，「白天沒有。」","dice":[],"choices":[],"next":"mira_after","art":6},"mira_seven":{"id":"mira_seven","title":"詢問七行","body":"「帳本上的七行，為什麼非得今晚寫完？」\n\n「因為那天少了七行。」米拉說，「師父明早一定要看。」\n\n「七行不能明天再寫？」\n\n她看著你，像沒聽懂這句話。\n\n「上次少兩袋，我被罵了一整天。」她說，「他罵完了，還叫搬運工每一袋都重點一次，點給我看。」\n\n一個婦人端著水盆從巷口走過，朝石階看了一眼。\n\n米拉望向遠處，手掌在白布裡慢慢蜷起來。\n\n「我想說，抄完就沒事了。」她的聲音小到像是跟自己說的。","dice":[],"choices":[],"next":"mira_after","art":6},"mira_after":{"id":"mira_after","title":"五｜你會說嗎","body":"磨坊裡傳來磨石轉動的聲音，轆轆地，沒有停過。\n\n鐘樓那頭響起鐘聲，一下，隔很久，又一下。不是火警，是召集議事的鐘。巷子裡的人開始往議事廳那邊走，經過石階時，都往這裡看一眼。\n\n米拉把石階上的鑰匙撿回去，握在白布裡。她衣襟底下鼓著一塊，是一本巴掌大的小冊子，邊角被煙燻黑了。\n\n「我抄運單的本子。」她看你在看，說，「跑的時候塞在衣服裡，就帶出來了。」\n\n她把衣襟拉好，盯著石縫，又不說話了。\n\n鐘又響了一下。\n\n米拉終於抬起頭。\n\n「你會跟鎮長說嗎？」","dice":["米拉感到忐忑。","米拉感到孤單。","你感到為難。","你感到被信任。","米拉感到害怕被丟下。","路過石階的人感到好奇。"],"choices":[{"label":"「我會說我查到的。妳說的，我也會一起說。」","to":"mira_after_truth"},{"label":"「先別說。等我們知道油桶哪裡來的再說。」","to":"mira_after_wait"},{"label":"「妳得自己去說。這樣藏著不是辦法。」","to":"mira_after_self"},{"label":"「今天還有人等著領糧，我們先去議事廳。」","to":"mira_after_hall"}],"art":6},"mira_after_truth":{"id":"mira_after_truth","title":"願意一起陳述","body":"「我會說我查到的。妳說的，我也會一起說。」\n\n米拉的指尖在石階上畫了半個圈。\n\n「要是他們只聽見我晚上進去呢？」\n\n「那我就說到他們聽見後面那半。」\n\n她看了你一會兒，把鑰匙在白布裡握緊。\n\n「鑰匙是我拿的，帳房是我進的，燈是我打翻的。」她一句一句說，像在背書，「我自己說。你在旁邊，別讓他們打斷我。」\n\n她站起來，比你矮了一個頭還多。\n\n「走吧。」","dice":[],"choices":[],"next":"hall","art":6},"mira_after_wait":{"id":"mira_after_wait","title":"先等油桶答案","body":"「先別說。等我們知道油桶哪裡來的再說。」\n\n米拉沒有馬上答話。她把衣襟裡那本小冊子按了按，像在確定它還在。\n\n「那你別忘了。」\n\n「不會。」\n\n「大人都這樣說。」她低著頭，「說著說著，就變了。」\n\n鐘又響了一下。她站起來，跟在你後面，始終隔著兩級石階。","dice":[],"choices":[],"next":"hall","art":6},"mira_after_self":{"id":"mira_after_self","title":"讓她自己說","body":"「妳得自己去說。這樣藏著不是辦法。」\n\n「我知道。」她低著頭，「可是……」\n\n「妳不說的話，」你站起來，她還坐著，「大家會吵得更凶，妳師父會更頭大。」\n\n走出巷口，你回頭看了一眼。她已經站起來了，卻不是往議事廳走，而是往井那邊去。白布包著的兩隻手垂在身側，走得很慢。\n\n鐘還在響。","dice":[],"choices":[],"next":"hall","art":6},"mira_after_hall":{"id":"mira_after_hall","title":"先看缺糧","body":"「今天還有人等著領糧，我們先去議事廳。」\n\n米拉慢慢把鑰匙塞回懷裡。\n\n「倉裡還剩多少麥子？」\n\n「他們正在點。」\n\n「師父點數，每次都要我再對一次。」她站起來，拍了拍裙擺上的灰，「我去幫他對。」\n\n她走在你前面，走了幾步，又放慢腳步，等你跟上。\n\n# 六　只剩五天","dice":[],"choices":[],"next":"hall","art":6},"hall":{"id":"hall","title":"六｜只剩五天","body":"議事廳在鐘樓底下，平常每月例會，坐不滿一半。今天擠得連窗台都坐了人，門外還站著一圈，雨打在他們肩上，沒有人走。\n\n鎮長坐在長桌一頭，兩眼略顯浮腫，眼圈也黑了。老倉丁把清單遞給他，手指在紙角捏出一圈濕印。\n\n「照原來的配給，大概就五天吧。」\n\n「五天？」有人拍桌，「冬天都還沒到！」\n\n「去南村調啊！」「南路斷了，鐵匠到現在都回不來，你去？」「那去石溪！」「他們自己都吃不飽了，會管我們的死活？」\n\n石溪在北邊，出了北門，翻過北坡，再過一座橋才到得了。石溪人少，如果缺了什麼，向來都是從霧谷找支援。\n\n長桌另一頭坐著守橋人，一身蓑衣還在滴水。他天沒亮就從北橋那邊下來了，懷裡揣著一卷油紙包著的地圖，從進門到現在，一直沒機會開口。\n\n鎮長敲了兩下木槌，聲音被鼎沸的人聲吞掉。\n\n「放火的抓到沒？」\n\n「抓到了，麥子會自己長回來嗎？」\n\n「不抓，誰保證不會再燒一次？」\n\n說這話的人往你這邊看。身邊兩個人默默挪開半步，挪得很有禮貌。","dice":["鎮長感到力不從心。","窗台上的人感到恐慌。","老倉丁感到壓力沉重。","守橋人感到著急。","你感到四面楚歌。","挪開半步的人感到戒備。"],"choices":[{"label":"站起來，說出帳房裡的油桶。","to":"hall_blame"},{"label":"先不開口，看鎮長怎麼收拾。","to":"hall_food"},{"label":"請醫師來，證明那十一分鐘的去向。","to":"hall_medicine"},{"label":"「我燒自己守的糧倉，圖什麼？」","to":"hall_map"}],"art":7},"hall_blame":{"id":"hall_blame","title":"A｜說出油桶","body":"你站起來。\n\n「鑰匙是從守衛室被人拿走的，這我認。」你說，「可是火不是從側門燒起來的，是帳房。帳房裡有好幾桶油。」\n\n議事廳裡的人聲忽然矮了一截。\n\n「油？」\n\n「帳房哪來的油？」\n\n「平常會有一小壺燈油，」一個搬運工說，「但昨晚帳房裡到處都是油。」說完，才發現大家都在看他，又把頭縮回去。\n\n所有人的眼睛轉向老倉丁。\n\n老倉丁沒動，手指還壓在那張清單上。\n\n「油桶是誰的，得查出來。」後排有人說，「晚上誰進了帳房，也得查出來。」\n\n人聲又漲了起來，一邊說到底誰敢在糧倉放那麼多油桶，一邊說大晚上怎會有人躲在糧倉，彷彿罪魁禍首近在眼前，人人都想把他揪出來才痛快，越吵越大聲。\n\n老倉丁把清單往桌上一推。\n\n「我只想知道，五天之後，誰能把麥子變出來？」\n\n鎮長立刻接過話頭：「先說糧。」他轉頭問老倉丁，「只剩五天的糧，怎麼解決？」\n\n「南路是走不通了，看來還是得找石溪……」老倉丁歪著頭喃喃自語。\n\n守橋人打斷了他的話，從長桌那頭站起來，解開油紙，把地圖攤在桌上，用手掌壓住紙邊。\n\n「往石溪的北路也走不了。昨夜北坡的路肩被水掏空了。」","dice":[],"choices":[],"next":"cartclue","art":7},"hall_food":{"id":"hall_food","title":"B｜先不開口","body":"你沒有說話，靠著牆站著。\n\n鎮長又敲了兩下木槌，這回敲得很重。\n\n「倉裡還剩多少能曬乾的？」他問老倉丁。\n\n老倉丁還沒開口，底下就先炸開了。\n\n「先查誰放的火吧！」\n\n「對，人都還沒抓，問什麼麥子？」\n\n「查到又怎樣？查到了，麥子會自己長回來？」\n\n「不查，下回再燒一次，你賠？」\n\n有人往你這邊看，有人只顧著拍桌子，還有一個孩子被嚇哭了，他娘一把摀住他的嘴。\n\n「沒泡到的四十來袋！」\n\n老倉丁的聲音一下子壓過了所有人。\n\n「挑完了，曬得乾，再撐三四天。就這麼多！」\n\n議事廳靜了下來。\n\n「三四天加五天，」有人小聲說，「也撐不過一個月。」\n\n守橋人從長桌那頭站起來，解開油紙，把地圖攤在桌上。\n\n「我要說的是北路。昨夜北坡的路肩被水掏空了。」","dice":[],"choices":[],"next":"cartclue","art":7},"hall_medicine":{"id":"hall_medicine","title":"C｜請醫師作證","body":"鎮長沒有等人群安靜，木槌往桌上一拍。\n\n「守衛。」\n\n整個議事廳轉過頭來。窗台上的孩子被大人一把拉下來，門外的人往裡擠，有人踩到別人的腳，罵了一聲，又不吵了。\n\n「鑰匙是從你那裡出去的，」鎮長手裡拿著守衛記錄簿說，「你離崗的時候，這上面連事由都沒寫。你要大家怎麼信你？」\n\n他說得很慢，一個字一個字，像在宣讀什麼。\n\n你看著他。心裡想著，昨晚發燒的就是你兒子，你自己不知道嗎？\n\n「請醫師來說清楚。」你說，「我那時候在哪裡，他知道。不然我說什麼你們都不會信。」\n\n議事廳裡嗡的一聲。\n\n「醫師？」\n\n「醫師叫守衛去幹嘛？」\n\n「替誰跑腿啊，大晚上的？」\n\n前排一個老婦人轉頭問旁邊的人：「誰家有人病了？」旁邊的人搖頭，又看向鎮長。\n\n鎮長握著木槌的手停在半空。\n\n「醫師還在診療所，燙傷的人排到門外去了。」有人說。\n\n鎮長看了看左右：「這件事慢慢查，散了會再說。」\n\n「還要等什麼，人都要沒飯吃了！」\n\n窗台上有人哼了一聲：「守衛擅離職守，怎樣都不對啦。」\n\n「我只離開十一分鐘！」\n\n「十一分鐘，十一分鐘也是擅離職守。」「對啊，你沒看住糧倉就不對啦。」「鑰匙都在你那裡，怎麼可以不在！」\n\n人群七嘴八舌說個沒完，後排有人拍了兩下手要大家停下來，又被旁邊的人瞪回去。\n\n鎮長沒有再看你。他敲了敲木槌，敲了三下，大家才靜了下來。\n\n守橋人趁著這片刻的安靜，解開油紙，攤開地圖。\n\n「我要說的是北路。昨夜北坡的路肩被水掏空了。」","dice":[],"choices":[],"next":"cartclue","art":7},"hall_map":{"id":"hall_map","title":"D｜我圖什麼","body":"「我燒自己守的糧倉，圖什麼？」你說，「我家這個冬天就不用吃飯了嗎？」\n\n議事廳裡靜了一瞬。\n\n「誰知道你圖什麼？」窗台上有人說。\n\n「說不定收了人家的錢。」\n\n「除了你，誰會有那把鑰匙？」「你昨晚該不會偷喝酒吧！」\n\n「不是你放的火，那你說是誰？」\n\n這一句一出來，所有人都看著你。\n\n你沒有答話。眼睛卻不自覺地往門邊飄了一下。\n\n艾倫站在門邊，右手縮在袖子裡。他沒有看你，看著地上那攤從門外流進來的雨水。\n\n「沒話說了吧？」\n\n「說不出來，就是你，不然還有誰？」\n\n鎮長敲了敲木槌，敲了三下，大家才靜了下來。\n\n鎮長轉頭問老倉丁：「只剩五天的糧，怎麼解決？」\n\n「南路是走不通了，看來還是得找石溪……」老倉丁歪著頭喃喃自語。\n\n守橋人打斷了他的話，解開油紙，攤開地圖。\n\n「往石溪的北路也走不了。昨夜北坡的路肩被水掏空了。」","dice":[],"choices":[],"next":"cartclue","art":7},"cartclue":{"id":"cartclue","title":"六｜藍繩與貨車","body":"「傍晚有輛大車往北走。」\n\n說話的是艾倫。他不知什麼時候擠到了桌邊，用沒受傷的那隻手撐著桌沿，「我在北門見過，車尾綁著藍繩。」\n\n「誰家的車？」鎮長問。\n\n「藍繩？」\n\n說話的是米拉。她擠在門邊的人堆裡，兩手的白布被雨淋得透濕。\n\n「快馬號的車，車尾都綁藍繩。」她說，聲音不大，靠門的幾個人都轉過頭去看她。\n\n她從衣襟裡掏出那本燻黑的小冊子，用纏著布的手指一頁一頁撥開，停在其中一頁，一行一行往下找。\n\n「昨天下午，快馬號卸了十八袋麥子給霧谷。」她說，「運單是師父傍晚交給我抄的。」\n\n老倉丁壓在清單上的手指，動了一下。\n\n「一個學徒丫頭，」窗台上有人說，「懂什麼帳？」\n\n米拉沒有抬頭。\n\n「車上還有三十二袋，要送去石溪。」\n\n議事廳裡沒有人說話。\n\n「三十二袋。」她又說了一次。","dice":["米拉感到緊張。","艾倫感到遲疑。","老倉丁感到不安。","鎮長感到看見一線希望。","窗台上的人感到輕蔑。","你感到振奮。"],"choices":[{"label":"讓米拉把運單拿到鎮長面前，請守橋人一起核對。","to":"cart_confirm"},{"label":"先問艾倫，他究竟看清楚那輛車多少。","to":"cart_eli"},{"label":"就算有麥子，那也是石溪的糧。","to":"cart_caution"},{"label":"「既然有可能是糧車，不管怎樣，我們得先去找！」","to":"cart_urge"}],"art":7},"cart_confirm":{"id":"cart_confirm","title":"核對運單","body":"「米拉，可以請妳把本子拿過來嗎？」你說，「請守橋人一起對一對。」\n\n人群在米拉面前讓出一條路。\n\n她走得很慢，兩隻包著白布的手捧著那本小冊子，走到長桌前，放在地圖旁邊。翻開那一頁，字很小，一筆一畫端端正正。\n\n守橋人彎下腰，看了很久，手指從運單移到地圖上。\n\n「下午卸貨，傍晚出北門。」他說，「我在橋頭守了一夜，沒看到什麼車過橋。昨晚那場雨，車八成卡在北坡了。」\n\n鎮長看著米拉：「這是妳抄的？」\n\n「是。」\n\n鎮長點了一下頭。老倉丁站在桌尾，眼睛一直盯著自己的清單，沒有往那本小冊子看。\n\n議事廳裡一時沒有人說話。鎮長的手指按在地圖上北坡那段彎路，很久沒有移開。","dice":[],"choices":[],"next":"departure","art":7},"cart_eli":{"id":"cart_eli","title":"問艾倫看到多少","body":"「你要不要再說清楚，看見的是怎樣的車？」你問艾倫。\n\n「帆布鼓鼓的，」艾倫說，「還有車尾綁的藍繩。」\n\n「車上有麥子嗎？」\n\n「我只知道車上有東西，可沒長透視眼。」\n\n「那趕車的是誰？你看到了嗎？」\n\n艾倫轉過頭來看你。整個議事廳都在等他回答，他卻只看著你，看了好一會兒。\n\n「現在是怎樣？你這是要審我？」\n\n窗台上有人哼了一聲：「整天遊手好閒的，現在連眼睛都不好使了。」\n\n「上回弄壞人家車架，怕是看到什麼車都趕緊躲開吧？」\n\n艾倫沒有回頭去找說話的人。他把那隻包著布的右手擱到桌上，掌心朝下，慢慢壓下去，壓到布底下滲出一點黃水。\n\n「天快黑了，」他說，「我真的沒看清楚。」\n\n他說話的時候，眼睛沒有離開你。\n\n議事廳裡一時沒有人說話。鎮長的手指按在地圖上北坡那段彎路，很久沒有移開。","dice":[],"choices":[],"next":"departure","art":7},"cart_caution":{"id":"cart_caution","title":"提醒石溪村的需要","body":"「就算車上載著麥子，那也是石溪的糧。」你說。\n\n議事廳裡靜了一下。\n\n一個婦人從人堆裡擠出來，手裡還提著那只裂了底的水桶。就是火場上砸在你腳邊的那一只。\n\n「石溪的孩子是孩子，我家的就不是？」她說，聲音在發抖，「你燒了我們的糧，現在還要替別人攢著糧？」\n\n「他們這些年吃了霧谷多少？」窗台上有人接著說，「換他們還一次，不行嗎？」\n\n「人家有糧，我們沒糧，就要搶人家的？」\n\n「誰說搶？是借！」\n\n「借了拿什麼還？拿燒焦的麥子？」\n\n米拉把小冊子抱在胸前，往後退了一步，退回門邊的人堆裡。\n\n後排有人說了一句，聲音不大，剛好讓整個議事廳都聽見：\n\n「守衛倒是很替石溪著想。說不定，跟石溪哪個姑娘好上了……」\n\n幾個人笑出聲來。\n\n婦人沒有笑。她手裡的水桶，咚的一聲落在地上。\n\n議事廳裡一時沒有人說話。鎮長的手指按在地圖上北坡那段彎路，很久沒有移開。","dice":[],"choices":[],"next":"departure","art":7},"cart_urge":{"id":"cart_urge","title":"催促派人","body":"「既然有可能是糧車，不管怎樣，我們得先去找！」\n\n守橋人抬起頭，看了你一眼。\n\n「北坡現在誰上去，誰就下不來。」他說，「路肩塌了一截，底下就是溪，水還在漲。」\n\n「總得有人去啊，如果車馬遇了險，也是要救。」\n\n「救什麼？掉溪裡去救？」守橋人把地圖往你面前一推，手指戳在那段彎路上，「我守那座橋三十年了，這種雨，我沒見過一回不鬧出人命的。」\n\n「你去？」窗台上有人問你。\n\n「好讓你一走了之？」\n\n「放火的跑了，誰來賠？」\n\n人群七嘴八舌起來，整個議事廳又吵成一團。\n\n艾倫把包著布的右手擱在腰上，沒有接話。米拉仍盯著小冊子，低聲說：「三十二袋。」\n\n鎮長敲了敲木槌，大家才靜了下來。他的手指按在地圖上北坡那段彎路，很久沒有移開。","dice":[],"choices":[],"next":"departure","art":7},"departure":{"id":"departure","title":"六｜北門之前","body":"雨小了些，從簷角滴下來，一聲一聲，敲在門外那排擠歪的木屐上。\n\n議事廳裡悶得透不過氣。濕氣、汗臭、不安、焦躁全擠在一起，蒸出一股酸味，底下則是壓著燒焦的煙味。每個人身上都有，誰也聞不出是從誰身上來的。\n\n沒有人散。大家都在等。\n\n鎮長抬起頭。\n\n「要過這個冬天，就得有人去看看那台車。」\n\n「去找個影子？」「路都塌了。」「誰去誰回不來！」\n\n「讓守衛去啊。」窗台上有人說，「找不到糧，就別回來。」\n\n這句話一出來，四周好幾個人都點頭，點得很快，好像早就在等有人先說。\n\n「他一個人去，跑了怎麼辦？」\n\n「那就叫艾倫跟著。他看過那台車，北路他也熟。」\n\n「再帶上那個學徒，就她記著車上有幾袋，有個證據。」\n\n說話的人一個接一個，聲音越說越輕快，像在分派一件早就該分派的差事。就是沒人說自己要去。\n\n你站在那裡，聽著自己的名字從一張嘴傳到另一張嘴。昨晚在火場上，人群也是這樣讓出一條路，讓大家看清楚遭殃的是誰。今天，他們又讓出了一條路，這回，路的盡頭是北坡。\n\n鎮長看了你一眼，又看了看艾倫和米拉。\n\n艾倫靠在門框上，那隻包著布的手縮在袖子裡，沒說好，也沒說不好。他盯著門外的雨，像那裡有什麼比議事廳好看。\n\n米拉把小冊子按在胸口，往門外看了一眼，又把頭低下去。她站的地方，剛好是一圈大人肩膀的影子裡。\n\n守橋人把地圖捲起來，用油紙包好，塞到你手裡。油紙還是濕的。\n\n「等雨再小一點，天亮再走。」他說，「北坡那段，貼著山壁走，別靠溪那邊。溪那邊的土路，看著是地，踩下去是水。」\n\n「就你們三個。」鎮長說，「別上北橋。找到車，先弄清楚車上有什麼。」\n\n他停了一下，越過長桌，靠近你，聲音壓得很低，只有你聽得見：\n\n「昨晚的事，等回來再說。」\n\n他身上也是那股煙味，還混著一點苦苦的藥味。\n\n人群開始往外散，有人撞了你的肩膀，沒有回頭。你拿著那卷地圖，站在議事廳門口。雨絲斜斜地落在你肩上，對街那座糧倉缺了半邊屋頂，黑黑地立在雨裡，像一個張著嘴、說不出話的人。","dice":["你感到被推了出去。","艾倫感到不服氣。","米拉感到惶恐。","鎮長感到放心不下。","守橋人感到擔憂。","分派差事的人感到鬆了一口氣。"],"choices":[{"label":"「我要親眼看看，車上到底裝的是什麼。」","to":"end_fact"},{"label":"「與其在這裡等人定罪，不如自己去把答案找回來。」","to":"end_defy"},{"label":"「五天。等不了。」","to":"end_act"},{"label":"不說話，握緊那卷地圖。","to":"end_observe"}],"art":8},"end_fact":{"id":"end_fact","title":"A｜為了確認：米拉","body":"雨又更小了，像是飄在空中的灰塵。倉前空地上搭起了一座草棚，底下鋪滿了曬麥的草蓆，四角壓著石頭。一盞馬燈掛在棚柱上，被風吹得晃來晃去。\n\n米拉蹲在草蓆邊，用一塊破布把滲進棚裡的雨水一點一點吸乾。兩隻手的白布換過了，比白天乾淨。\n\n「這麼晚，還不睡？」\n\n她嚇了一跳，抬頭看是你，又低下頭去。\n\n「麥子淋了雨，明天就發芽了。」\n\n你在她旁邊蹲下。\n\n「運單上那三十二袋，」你說，「妳再說一次給我聽。」\n\n「快馬號，昨天下午入倉十八袋，續運石溪三十二袋。每袋一斗二升。車尾綁藍繩，帆布兩層。」\n\n她沒有翻本子，一口氣說完，連停都沒停。\n\n「妳都記得？」\n\n「師父說，連這都記不住，就別喊他師父。」\n\n馬燈晃了一下，她的影子在草蓆上跟著晃。\n\n「明天，」她說，「要是到了那裡，車上什麼都沒有呢？」\n\n「那就是沒有。」\n\n「那大家會說，是我抄錯了。」她把那塊破布擰乾，擰得很用力，白布底下又滲出一點黃水，「燈是我打翻的，數字也是我抄錯的。什麼都是我。」\n\n你沒有答話。\n\n她把破布攤在膝蓋上，攤平了，又摺起來。\n\n「你相信我嗎？」","dice":[],"choices":[],"next":"finish","art":8},"end_defy":{"id":"end_defy","title":"B｜為了奪回選擇：鎮長","body":"鎮長家在鐘樓後頭，門口兩盞燈只點了一盞。\n\n你敲門，敲了三下。門開了一條縫，是鎮長自己。他看見是你，沒有讓開，也沒有關門。\n\n屋裡飄出一股苦苦的藥味。\n\n「我說了，等你回來再說。」\n\n「我現在就要說。」\n\n鎮長看了你一會兒，回頭往屋裡看了一眼，才側身讓你進來，把門在身後帶上。\n\n廳裡沒點燈，只有裡屋門縫透出一點光。\n\n「昨晚你兒子燒成那樣，醫師叫我去拿藥，你是知道的。」你說，「今天在議事廳，你一個字都沒說。」\n\n「我說了，全鎮就知道我兒子發燒。」鎮長的聲音壓得很低，「這種天，這種時候，一個孩子發燒，你知道他們會說什麼？瘟疫。瘟疫一傳開，霧谷就不只是缺糧了。」\n\n「所以就讓他們說我放火。」\n\n「我沒有說你放火。」\n\n「你也沒有說不是。」\n\n鎮長沒有回答。裡屋傳來一陣咳嗽，很小，很急，咳了好一陣才停。鎮長的頭轉過去，聽著，直到咳嗽停了，才轉回來。\n\n「車找回來，」他說，「我就說。」\n\n「要是找不回來呢？」\n\n鎮長看著你，眼睛底下那圈黑更深了。\n\n「那我們兩個，」他說，「就都別說了。」","dice":[],"choices":[],"next":"finish","art":8},"end_act":{"id":"end_act","title":"C｜為了眼前急難：老倉丁","body":"糧倉裡還有燈。\n\n老倉丁一個人坐在沒塌的那半邊，面前堆著一排救出來的麥袋。他一袋一袋解開袋口，抓一把出來看，聞一聞，再紮回去。燈油只剩淺淺一層，火苗矮得快要貼到燈芯。\n\n「師父，我來借東西。」\n\n「借什麼？」\n\n「繩子。還有空麻袋，越多越好。」\n\n老倉丁抬起頭。\n\n「三十二袋，」他說，「你們三個背得回來幾袋？」\n\n「背得回來幾袋，算幾袋。」\n\n老倉丁沒說話，起身走到牆角，從一堆燒焦的雜物底下拖出一捆麻袋，抖了抖灰，又拖出一捆繩子，一起丟在你腳邊。\n\n「北坡那段，繩子要綁在樹上，不能綁在石頭上。石頭會跟著土一起滑。」\n\n「你走過？」\n\n「年輕的時候，我也是搬運工。運糧這種事，哪個管倉的沒走過。」\n\n你把麻袋扛上肩。走到門口，你停下來。\n\n「快馬號的車，師父認得吧？」\n\n老倉丁手裡正紮著一個袋口，繩子在他指頭上繞了一圈，停住了。\n\n「霧谷附近幾個村，誰不認得。」\n\n「趕車的是誰？」\n\n燈芯噼啪響了一聲。老倉丁低著頭，把那個結打完，紮得很緊，紮了兩道。\n\n「你遇上了，」他說，「替我跟他說一聲——」\n\n他沒有說完，把那袋麥子推到一邊，又解開下一袋。\n\n「說什麼？」\n\n「算了，去睡吧。」他說，「天亮還要走路。」","dice":[],"choices":[],"next":"finish","art":8},"end_observe":{"id":"end_observe","title":"D｜為了親眼看見：艾倫","body":"你回到守衛室，沒有點燈，坐在長凳上聽雨。\n\n後來，有腳步聲停在門外。停了很久。然後是敲門聲。\n\n你開了門，門外是艾倫。他手裡提著一小罈酒，罈口的封泥還沒拆，右手的布換過了，包得比白天還厚。\n\n「喝一點，」他說，「明天走得動。」\n\n他找了個碗，拍開封泥，倒了半碗，推到你面前。他自己沒倒，罈子擱在腳邊，用那隻好手扶著。\n\n你沒有喝。你喝不下。\n\n「你知道那是誰的車。」你說。\n\n艾倫看著碗裡的酒，看了很久。\n\n「快馬號是賀維的。」他說，「我欠他一副車架。」\n\n「所以你今天才說沒看清楚。」\n\n「我看得一清二楚。藍繩是他自己綁的，綁得歪歪扭扭，跟他的人一樣。」\n\n他終於給自己倒了一碗，一口喝乾，嗆了一下，咳了兩聲。\n\n「明天去北坡，」他說，「目的是去找糧。如果不喝一點，我會以為是去給債主賠罪。」\n\n「那你還去。」\n\n「全鎮都看著，我不去，他們要怎麼說我？」他把碗放下，放得很重，「遊手好閒的，連一趟路都不敢走。」\n\n他站起來，提著罈子走到門口，又停下來，沒有回頭。\n\n「你呢？」他問，「你去幹嘛？」\n\n# 第一集尾聲","dice":[],"choices":[],"next":"finish","art":8},"finish":{"id":"finish","title":"第一集尾聲｜走向北路","body":"隔天清晨，雨變成霧。\n\n你背著繩索、乾糧和那卷地圖，站在北門。\n\n霧從北坡那頭漫下來，漫過門外的石板路，漫過門框，連門柱上的鐵環都濕了。路的那頭有沒有車，車上是不是麥子，沒有人知道。\n\n艾倫已經到了，靠在門柱上，右手包得厚厚的，沒受傷的那隻手提著一捆繩子。他看見你，點了一下頭，沒說話。\n\n米拉來得最晚，是跑著來的，喘著氣，衣襟底下鼓著那本小冊子。她在你們身後兩步的地方停下來。\n\n三個人誰也沒說話。\n\n守橋人站在門邊，替你們把門閂拉開。北門吱呀一聲打開，霧從門外湧進來，冷冷地貼上你的臉。\n\n你們走進霧裡。\n\n鐘聲從霧谷傳來，一聲比一聲遠。","dice":[],"choices":[],"next":null,"art":8}};const route=["opening", "fire", "mayor", "guardroom", "well", "eli_after", "granary", "keeper", "mill", "mira_after", "hall", "cartclue", "departure", "finish"];const SAVE='fog-valley-episode1-final-v3-20261128';
const $=id=>document.getElementById(id);const initial=()=>({id:'opening',trail:[],rolled:null});let state=initial();try{const x=JSON.parse(localStorage.getItem(SAVE));if(x&&N[x.id]&&Array.isArray(x.trail))state=x}catch(e){}
