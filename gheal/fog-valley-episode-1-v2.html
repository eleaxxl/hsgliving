<style>

,transform .15s}.choice:hover,.choice:focus-visible{background:#eff3ed;border-color:var(--accent);outline:none;transform:translateY(-1px)}.choice .num{font:600 12px 'Noto Sans TC',sans-serif;color:var(--accent);margin-right:12px;letter-spacing:.1em}.continue{border:0;border-radius:3px;background:var(--accent);color:#fff;padding:12px 22px;font:500 14px/1.7 'Noto Sans TC',sans-serif;letter-spacing:.09em}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;padding:11px 17px;font:13px/1.7 'Noto Sans TC',sans-serif}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;color:var(--muted);font:12px/1.6 'Noto Sans TC',sans-serif}.marker{display:inline-block;width:6px;height:6px;border-radius:100%;background:var(--gold);vertical-align:middle;margin-right:8px}.landing{text-align:center;padding-top:40px}.sigil{width:100px;height:100px;border:1px solid #9aab9f;border-radius:50%;margin:0 auto 43px;position:relative}.sigil:before{content:"";position:absolute;inset:12px;border:1px solid #bdc9be;border-radius:50%}.sigil:after{content:"";position:absolute;inset:47px;background:var(--accent);border-radius:50%}.landing .title{font-size:clamp(35px,6vw,52px);letter-spacing:.18em;margin-bottom:13px}.landing .sub{color:var(--muted);margin:0 0 35px;font-size:16px}.landing .intro{max-width:540px;margin:0 auto 40px;line-height:2.4}.landing .intro p{margin:0 0 14px}.landing .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.tiny{font:12px/2 'Noto Sans TC',sans-serif;color:var(--muted)}.endpaper{padding:25px 0 10px}.endpaper .title{margin-top:12px}.endpaper .story{font-size:17px;line-height:2.25}.codebox{margin-top:33px;border:1px solid var(--line);padding:22px;background:#f0f1eb;word-break:break-all}.codebox textarea{width:100%;min-height:80px;background:transparent;border:0;resize:vertical;color:var(--ink);font:12px/1.7 monospace;padding:10px 0;outline:none}.endactions{display:flex;gap:11px;flex-wrap:wrap;margin-top:14px}.dialog{position:fixed;inset:0;background:rgba(24,35,29,.45);display:grid;place-items:center;padding:20px;z-index:10}.dialog[hidden]{display:none}.modal{background:var(--paper);width:min(520px,100%);padding:28px;box-shadow:0 30px 60px #0002}.modal h3{margin:0 0 14px;font-size:23px}.modal p{font-size:14px;line-height:1.9}.modal textarea{width:100%;height:140px;padding:10px;font:13px/1.7 monospace;border:1px solid var(--line);background:white;resize:vertical}.modal .controls{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.err{color:var(--danger);font:13px/1.8 'Noto Sans TC',sans-serif}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:640px){body{font-size:16px;line-height:2}.shell{width:min(100%,calc(100% - 12px));padding-top:12px}.panel{min-height:calc(100vh - 106px);padding:30px 23px}.top{padding:0 11px}.rule{margin:33px 0 20px}.landing{padding-top:20px}.title{margin-bottom:26px}.choice{padding:13px 14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<div class="dialog" id="dialog" hidden><div class="modal"><h3>冒險紀錄</h3><p>這份進度只保存在這個瀏覽器。第一集完成後，還可以另存承接碼，供下一集使用。</p><div class="controls" style="justify-content:flex-start"><button class="secondary" id="resumeBtn">回到故事</button><button class="secondary" id="restartBtn">從頭開始</button></div><div class="rule" style="margin:24px 0"></div><p>已有承接碼？可以從這裡讀回第一集的紀錄。</p><textarea id="importCode" placeholder="貼上冒險紀錄碼"></textarea><p class="err" id="importError"></p><div class="controls"><button class="secondary" id="closeModal">取消</button><button class="continue" id="importBtn">讀取紀錄</button></div></div></div>
<script>
'use strict';
const ROOT='fogvalley-episode1-v2';const VERSION=2;
const P=(...paragraphs)=>paragraphs;
// The first six chapters follow the user's revised novel; optional routes add new prose.
const N={
opening:{chapter:'序章',title:'雨下到第四天',text:P('那天晚上，你離開了十一分鐘。','雨下到第四天，九點鐘聲剛過，醫師冒雨衝進守衛室，把一張字跡暈開的紙條塞給你。','「鎮長的小兒子燒到說胡話了。藥在東門外的棚子，我這裡還有一個在流血。」','他袖口還沾著沒乾的血跡。走到門口，又回頭補了一句：「別讓人知道是送給誰的。」','守衛的規矩，離崗要記簿。你記了，又把糧倉側門那把缺角的備用鑰匙掛回第二個銅鉤。鉤子晃了兩下，停住。','藥送到的時候，警鐘響了三聲。','第一聲你以為有人落水。第二聲、第三聲……','火警。'),next:'fire'},
fire:{chapter:'一 · 十一分鐘',title:'火光裡的鑰匙',text:P('糧倉的屋頂已經著了火。人群在你面前讓出一條路。那條路不是讓你過去的，是讓大家看清楚「消失的守衛是哪個傢伙」。','「側門怎麼開著？」「今晚誰值班啊？」「就他！」「現在才回來？」','一個婦人提著空水桶，朝你腳邊砸下來。「我家孩子冬天吃什麼？」','鎮長從焦黑的木架後走出來，手裡舉著一把鐵鑰匙。老倉丁瞇眼看了看，搶先開口：「這是糧倉側門的鑰匙，平常掛在守衛室。」','「我們趕到時，」鎮長說，「它就插在鎖上。」','「我出門的時候，還掛在牆上。」','「你出門？」','鎮長把鑰匙甩了甩，火光一路在鐵齒上閃爍。','「告訴我，你為什麼要放火燒糧倉？」'),choices:[
{t:'「放火的不是我。我是替醫師送藥。」',to:'fire_plain',fx:{mayor:1},tag:'plain'},
{t:'「你憑什麼說是我？你自己不是也有鑰匙？」',to:'fire_fight',fx:{mayor:-2,crowd:-1},tag:'fight'},
{t:'「救火的人還在裡面，現在要先吵這個？」',to:'fire_rescue',fx:{crowd:1},tag:'rescue'},
{t:'先看著鑰匙，不在眾人面前回答。',to:'fire_silence',fx:{mayor:-1,clues:1},tag:'silence'}]},
fire_plain:{chapter:'一 · 十一分鐘',title:'屋簷下',text:P('「送藥？」','「醫師來找我。你可以問他。」','鎮長握著鑰匙的手指收得死緊。旁邊有人插嘴：「什麼藥非得半夜送？」','「先救火！」滿臉灰的搬運工吼了一聲，「裡頭還有人沒出來！」','鎮長朝守衛使了個眼色。「你過來。」'),next:'mayor'},
fire_fight:{chapter:'一 · 十一分鐘',title:'你出門？',text:P('你話才出口，人群就像等這一刻似的往前擠。','「他還敢反問鎮長！」','「有沒有放火，問醫師不就知道了？」另一個人說。','鎮長沒有立刻答話。他把那把缺角的鑰匙捏在掌心，看向糧倉，朝大家喊「先救火，麥子燒光大家冬天就別過了！」','人群又急急忙忙散開，打水的打水，喊人的喊人。','「你先跟我到屋簷下，」鎮長靠近你，低聲說，「有些事我先問清楚。」'),next:'mayor'},
fire_rescue:{chapter:'一 · 十一分鐘',title:'屋樑落下',text:P('你扯過旁邊一個人的水桶，衝向側門。','一根焦黑的屋樑從高處落下，砸在離你半丈遠的泥水裡。有人罵了聲髒話，拉住你的衣領。','「別進去！裡頭有人，從後面救！」','你把水桶遞給後排的搬運工，回頭時，鎮長已經等在屋簷下。','他朝你招手，眼神仍落在那把鑰匙上。'),next:'mayor'},
fire_silence:{chapter:'一 · 十一分鐘',title:'銅鉤',text:P('鎮長把鑰匙舉得更高，像要你看清楚缺角的那一側。','你記得出門時第二個銅鉤晃了兩下。','「他不說話！」有人喊。','一個搬運工從火場跑出來：「後頭還有人！都別擋路！」','鎮長讓開路，壓低聲音：「跟我過來。」'),next:'mayor'},
mayor:{chapter:'二 · 鎮長的兒子',title:'交代一個大家聽得下去的',text:P('鎮長把你帶到屋簷下，離人群十步，剛好聽不見，也剛好看得見。','「孩子的事，別在這裡提。」','「我是替你——」','「我知道。」他頓了一下，「我知道。」','屋樑在遠處斷了一聲。','「可是鑰匙是從你守的地方出去的。這件事，你得給全鎮一個交代。」','鎮長看著火場，沒有看你。'),choices:[
{t:'「那你就跟大家說，醫師確實找過我。」',to:'mayor_public',fx:{mayor:-1,crowd:1},tag:'ask-public'},
{t:'「孩子的事，我不說。但你也別說我放了火。」',to:'mayor_private',fx:{mayor:1},tag:'protect-child'},
{t:'「天亮前，我會查清楚誰動了鑰匙。」',to:'mayor_inquiry',fx:{mayor:1,clues:1},tag:'investigate-key'},
{t:'「既然你知道，就請你讓我回去救火。」',to:'mayor_work',fx:{crowd:1},tag:'work'}]},
mayor_public:{chapter:'二 · 鎮長的兒子',title:'一句話',text:P('「我沒有要你說孩子的病。」','鎮長終於轉過頭。','「你現在提醫師，全鎮都要問他半夜在替誰跑腿。你要他怎麼回答？」','雨打在屋簷上，細得像撒豆子。','「等火壓下來，我找醫師談。」他說，「先別在這裡喊。」'),next:'guardroom'},
mayor_private:{chapter:'二 · 鎮長的兒子',title:'十步',text:P('鎮長看了你一眼，將鑰匙放進外套口袋。','「我說話太急了。」','他站著不動，外面有人叫他名字。','「天亮前，還是得把鑰匙查清楚。」','他走回火光裡，腳步比來時快。'),next:'guardroom'},
mayor_inquiry:{chapter:'二 · 鎮長的兒子',title:'鑰匙',text:P('「十一分鐘。」鎮長說，「鑰匙怎麼會在那十一分鐘裡被人拿走？」','「不知道。」','「那就去查。」他把鑰匙交給你看，又收回掌心，「天亮前，給我一個能查證的說法。」','火場裡有人搬出一袋濕麥子，袋底開了，麥粒散成一地。'),next:'guardroom'},
mayor_work:{chapter:'二 · 鎮長的兒子',title:'濕麥子',text:P('鎮長指著東邊的人群。「去那裡搬水。不要碰側門，等人把屋頂支起來。」','你和搬運工輪著拎桶，直到胳膊痠得抬不起來。','有人認出你，將自己的水桶也塞過來；另一個人替你扶住滑下的繩。','火勢稍低，你回到守衛室，鞋底積著厚厚一層黑泥。'),next:'guardroom'},
guardroom:{chapter:'二 · 鎮長的兒子',title:'守衛室',text:P('門虛掩著。你出門時明明帶上了。','第二個銅鉤空著，泥地上幾個沒乾透的腳印，鞋尖朝牆。','傍晚艾倫端來的湯，擱在簽名簿旁，冷湯上還浮著一層油。','「別睡著。」艾倫離開時丟給你這句。你沒睡著，糧倉還是出事了。','屋外傳來人喊：「井邊還有燙傷的，快拿乾布！」'),choices:[
{t:'先看簽名簿和門邊的腳印。',to:'guard_inspect',fx:{clues:2},tag:'inspect'},
{t:'去井邊找艾倫。他比誰都熟悉守衛室。',to:'guard_eli',fx:{eli:1},tag:'find-eli'},
{t:'把鑰匙架與門的情況記下，留給鎮長。',to:'guard_report',fx:{mayor:1,clues:1},tag:'report'},
{t:'先回去替火場搬水，等人群散了再查。',to:'guard_help',fx:{crowd:1},tag:'help'}]},
guard_inspect:{chapter:'二 · 鎮長的兒子',title:'第二個銅鉤',text:P('你蹲在門後看了半天。鞋印的邊緣還沒被雨踩平，卻辨不出是誰的。','簽名簿上只留下你離崗的一行；艾倫端來的湯已經涼透。','你把銅鉤掰直，才發現它底下還有一道新的刮痕。','井邊有人在叫艾倫的名字。'),next:'well'},
guard_eli:{chapter:'二 · 鎮長的兒子',title:'井邊',text:P('你從守衛室跑出來，繞過鐘樓。','井邊的木桶旁蹲著一個熟悉的背影。','艾倫的右手泡在水裡，袖口焦了一圈。','他聽見腳步聲，沒回頭：「火滅了沒？」'),next:'well'},
guard_report:{chapter:'二 · 鎮長的兒子',title:'留一筆',text:P('你在簽名簿旁補了一行：九時後，有人進入守衛室，側門備用鑰匙離架。','沒有名字，也沒有猜測。','把筆擱回去時，你看到門邊一條新鮮的泥痕，像有人急著轉身。','外面傳來艾倫的聲音：「水借我一下！」'),next:'well'},
guard_help:{chapter:'二 · 鎮長的兒子',title:'火場',text:P('水桶傳了七八趟。半邊屋頂塌下來，濕麥子的重量壓得幾個搬運工彎了腰。','「去井邊拿繩！」有人喊。','你繞過鐘樓，看到艾倫正在木桶裡泡手。'),next:'well'},
well:{chapter:'三 · 井邊的手',title:'跑得比較快的人',text:P('艾倫比你大兩個月，從小就比你高，跑得也比你快。小時候兩人去鐘樓後頭偷摘梨，被抓到的總是你。','他把右手泡在木桶裡，袖口焦了一圈，水面漂著一片燒黑的布。','「你拿了鑰匙？」','「是我拿的。鐘一響，我就在附近。倉裡有人敲門，一下一下，跟打鼓似的。我只好去你那裡拿。」','「鑰匙為什麼留在鎖上？」','「有人喊屋頂要塌，我衝進去拉人，還管什麼鑰匙。」','他抽出右手，腫得發亮。','「你去跟鎮長講側門是我開的，明天全鎮就說火也是我放的。」','「賀維那副車架，我到現在還沒賠。這回再扯進糧倉，你說，我拿什麼賠？」'),choices:[
{t:'「這件事我先不說。」',to:'eli_hide',fx:{eli:2,mayor:-1},tag:'hide-eli'},
{t:'「你是在救人。明早我們一起去說。」',to:'eli_together',fx:{eli:1,mayor:1},tag:'together'},
{t:'「你拿走我的鑰匙，倒叫我替你扛？」',to:'eli_attack',fx:{eli:-2},tag:'attack-eli'},
{t:'「你究竟救了誰？屋裡還有人嗎？」',to:'eli_question',fx:{eli:0,clues:1},tag:'ask-rescue'}]},
eli_hide:{chapter:'三 · 井邊的手',title:'好朋友',text:P('「我就知道你會懂。」艾倫把木桶倒扣在井旁。','他伸手想拍拍你的肩，卻在半空停住。','「那邊有人喊我去搬木料。回頭我請你喝酒。」','巷口兩個孩子跑過，學大人的腔調喊：「抓到放火的啦！」','艾倫看了他們一眼，走得比平常快。'),next:'eli_after'},
eli_together:{chapter:'三 · 井邊的手',title:'等到天亮',text:P('「一起去？」','艾倫用腳尖踢了踢倒在地上的水桶。','「你倒說得容易。你先去說，我跟在後頭，看鎮長先抓誰。」','他嘴上抱怨，卻沒走開。','「天亮前。你別又跑去送什麼藥。」'),next:'eli_after'},
eli_attack:{chapter:'三 · 井邊的手',title:'那把鑰匙',text:P('艾倫把右手藏回袖口。','「我衝進去救人，你倒先查起我了。」','「你拿鑰匙沒說。」','「你離崗也沒問過我。」','他看著井沿，笑了一聲，沒有笑意。','「從小到大，被抓到的總是你。這次換我，好不好？」'),next:'eli_after'},
eli_question:{chapter:'三 · 井邊的手',title:'黑漆漆的',text:P('「黑漆漆的，誰看得清。」','艾倫把一條燒焦的袖子翻到外面，布上有一道細細的劃痕。','「她喊了一聲，我拖著人從側門出來。後頭屋樑就塌了。」','「她？」','艾倫把袖子捲回去。「你明天去問問誰的手燙傷了，不就知道了？」'),next:'eli_after'},
eli_after:{chapter:'三 · 井邊的手',title:'孩子的叫喊',text:P('巷口跑過幾個孩子，喊著：「抓到放火的啦！」「抓到放火的啦！」','艾倫把桶裡的水倒掉，又甩了甩木桶。','「你自己決定要怎麼說。」','從小到大，他一直是跑得比較快的那一個。','天快亮時，鐘樓旁有人喊：「糧倉壓住了半邊，能撈的麥子先撈！」'),next:'granary'},
granary:{chapter:'四 · 不該有的油味',title:'焦味底下',text:P('火終於壓下去。糧倉燒掉半邊屋頂，麥袋泡在黑水裡。每撈起一袋，就有人報一個數字，數字一個比一個小。','火是從帳房燒起來的。帳房與麥袋間隔著一扇防火的厚木門。搬運工撬到一半，扔下鐵棍。','「不用撬了！釘腳早斷了。前天我就貼了修閂的字條，貼給鬼看！」','焦味底下有股甜膩的油味。牆邊歪著幾個鐵桶，一個裂了口，旁邊黏著燒成黑炭的粗布。','「帳房哪來這麼多油？」搬運工問，「平常不就一小壺，添燈用的。」','老倉丁從倒塌的木架後走出來。','「先搬麥子！要在這裡查案，等全鎮餓死了再查。」'),choices:[
{t:'走到油桶旁，查看燒焦的布與門閂。',to:'granary_oil',fx:{clues:2},tag:'oil'},
{t:'當面問老倉丁：油是誰搬進來的？',to:'granary_pressure',fx:{keeper:-2,clues:1},tag:'pressure-keeper'},
{t:'先替搬運工搶救還能用的麥袋。',to:'granary_grain',fx:{crowd:1,keeper:1},tag:'save-grain'},
{t:'去翻帳房的登記簿，看昨晚還有誰進來。',to:'granary_book',fx:{clues:2,keeper:-1},tag:'book'}]},
granary_oil:{chapter:'四 · 不該有的油味',title:'兩個門',text:P('你先看側門的鎖，鎖舌完好，鑰匙可以從外面開啟。','帳房那道厚木門卻不同。它不靠鑰匙，只靠門閂將門扣緊；如今釘腳斷了，木板向外歪著。','你用腳輕推，門便晃開。','老倉丁在背後喊：「別碰那些油桶！能搬的先搬出去！」','你拾起那塊焦黑的粗布，鼻子裡滿是油味。'),next:'keeper'},
granary_pressure:{chapter:'四 · 不該有的油味',title:'白天貨進貨出',text:P('「油是誰送來的？」','「白天貨進貨出，什麼東西不暫放？」','「你知道有油？」','老倉丁背對著你綁袋口，繩結打了兩次都沒打上。','「你到底要救麥子，還是要救自己的名聲？」','旁邊的搬運工不說話了，手裡那袋濕麥子慢慢滴著水。'),next:'keeper'},
granary_grain:{chapter:'四 · 不該有的油味',title:'半袋',text:P('你和搬運工扛出十幾袋。有人喘著氣說，還有一半能曬；另一個人一摸袋底，整袋散成糊。','老倉丁過來替你打繩結，手上仍是一股煙味。','「這批先擺去磨坊，別跟燒穿的混著。」','你將最後一袋放下，聞到從帳房飄過來的油味。','老倉丁見你往那邊看，忽然叫人把空車推過去。'),next:'keeper'},
granary_book:{chapter:'四 · 不該有的油味',title:'七行',text:P('帳桌上壓著一本燒焦的登記簿。前面幾頁黏成一團，最後一頁完好，留著七行空白。','頁角一個墨點，又圓又深，像筆尖停在那裡很久。','老倉丁走過來，伸手就要抽走帳簿。','「這些是倉裡的帳，別弄壞了。」','你注意到他腰上的鑰匙只剩兩把。昨天還有三把。'),next:'keeper'},
keeper:{chapter:'四 · 不該有的油味',title:'老倉丁',text:P('老倉丁腰上那串鑰匙，你見過不下百次：正門、帳房、木櫃，三把。今天他走起路來，只響兩聲。','「米拉昨晚來過？」','他手裡的繩結鬆了。','「她一個孩子，」他說，「懂個屁。」','一個搬運工從外面探頭：「師父，米拉的手燙得不輕。人在磨坊那裡。」'),choices:[
{t:'「你明知道油桶不該放帳房。」',to:'keeper_accuse',fx:{keeper:-2},tag:'blame-keeper'},
{t:'「米拉在哪？我先去問她。」',to:'keeper_mila',fx:{mira:1},tag:'seek-mila'},
{t:'「門閂的字條是誰寫的？你見過嗎？」',to:'keeper_door',fx:{clues:1,keeper:-1},tag:'door-note'},
{t:'「剩下的麥子得先救。你告訴我要搬哪幾袋。」',to:'keeper_work',fx:{keeper:2,crowd:1},tag:'keeper-help'}]},
keeper_accuse:{chapter:'四 · 不該有的油味',title:'誰答應的',text:P('「誰說油桶是我放的？」','「我沒說是你放的。」','老倉丁把臉轉向一邊，忽然又轉回來。','「那你這樣問，是要我替誰認錯？」','遠處有人喊米拉的名字。他咬著牙，拎起麥袋走了。'),next:'mill'},
keeper_mila:{chapter:'四 · 不該有的油味',title:'磨坊',text:P('「磨坊外頭。」老倉丁說，「她應該在那兒。」','「你不去看看？」','老倉丁把繩子打了死結。','「我現在一走，這些糧誰點？」','他沒看你，將一袋濕麥子推到車上。'),next:'mill'},
keeper_door:{chapter:'四 · 不該有的油味',title:'貼給鬼看',text:P('「前天搬運工留過紙，」老倉丁說，「我知道。」','「那道門是防火用的。」','「鐵匠困在南村。你叫我拿什麼修？」','他像是要說別的，卻又看了一眼那些油桶。','「先搬麥子。」'),next:'mill'},
keeper_work:{chapter:'四 · 不該有的油味',title:'搬到天亮',text:P('老倉丁指了兩排還沒泡爛的袋子。你們一趟一趟搬，泥水灌進鞋子裡。','最後一袋扛上車時，他拿袖子抹了把臉。','「米拉在磨坊。你去看看她吧。」','「你呢？」','「我把這裡點完。」'),next:'mill'},
mill:{chapter:'五 · 七行',title:'石階上的學徒',text:P('米拉十五歲，來糧倉還不到一年。上個月師父當著搬運工的面罵她，說她連袋數都數不清。當天全倉聽見，第二天全鎮知道。','你在磨坊外的石階上找到她。兩手纏著白布，布底滲出淡黃的水。','「師父說什麼了？」她先問。','「你怕他說什麼？」','「……說我又做錯了。」她盯著石縫裡一根草，「帳少對了七行。少一行，他就要罵一次。」','她從懷裡掏出一把鑰匙，放在石階上。正門的。','「我等他睡了才拿。想說抄完就放回去。」','「帳房裡有什麼？」','「好黑。我摸著牆走，撞到幾個桶。空的吧，我以為。」','「我點了燈。袖子一掃——」','她的手抬起來，比了個蓋的動作，比到一半，停在半空。','「那塊布是臭的，不是燒焦那種臭。它燒得比我的手還快。」'),choices:[
{t:'「妳說那些油不是妳搬的，我聽見了。」',to:'mira_listen',fx:{mira:2},tag:'mira-listen'},
{t:'「但妳明知道晚上不能進去。妳打算怎麼說？」',to:'mira_press',fx:{mira:-2},tag:'mira-press'},
{t:'「先別提火。手傷得這麼重，醫師看過沒？」',to:'mira_care',fx:{mira:1},tag:'mira-care'},
{t:'「帳本上的七行，為什麼非得今晚寫完？」',to:'mira_seven',fx:{mira:1,clues:1},tag:'mira-seven'}]},
mira_listen:{chapter:'五 · 七行',title:'那幾個桶',text:P('她先低下頭，看了看手上的白布。','「我在那裡做了快一年，白天從沒看見那麼多油桶。」','「妳看清楚了？」','「沒有，太暗。我還以為是空桶。」','一個婦人端水盆路過，慢下腳步。','「就是她吧？半夜偷進糧倉那個。」','米拉把手縮進袖子裡。「那些油不是我搬進去的。」'),next:'mira_after'},
mira_press:{chapter:'五 · 七行',title:'別再問了',text:P('「我知道不能去。」米拉說。','「那妳還去？」','「我……」','她轉頭看見一個端水盆的婦人站在路旁。','婦人說：「就是她吧？夜裡偷偷進糧倉那個。」','米拉把鑰匙抓回掌心，攥得白布都起了皺。','「你要說就去說。」她的聲音比剛才小。'),next:'mira_after'},
mira_care:{chapter:'五 · 七行',title:'白布',text:P('「醫師忙著救別人。」米拉說，「我去排過隊，前面還有四個。」','她把手藏進袖子，卻被白布勾住。','你取出隨身一塊乾淨的布，放在石階上。','她等了一會兒，才伸手去拿。','「我真沒見過那些油桶。」她說，「白天沒有。」'),next:'mira_after'},
mira_seven:{chapter:'五 · 七行',title:'墨點',text:P('「因為那天少了七行。」米拉說，「老倉丁明早一定要看。」','「七行不能明天再寫？」','她看著你，像沒聽懂這句話。','「上次少兩袋，我被罵了一整天。」','一個端水盆的婦人路過，朝石階看了一眼。','米拉望向遠處，手掌在白布裡慢慢蜷起來。'),next:'mira_after'},
mira_after:{chapter:'五 · 七行',title:'你會說嗎',text:P('米拉盯著石縫，從頭到尾沒說自己是好人。','「油不是我搬進去的。」','隔了一會兒，她又說了一次。','磨坊門口傳來磨石的聲音，轆轆地，沒有人接話。','米拉終於抬起頭。','「你會跟鎮長說嗎？」'),choices:[
{t:'「我會說我查到的。妳說的，我也會一起說。」',to:'mira_after_truth',fx:{mira:1,mayor:1},tag:'tell-all'},
{t:'「先別說。等我們知道油桶哪裡來的再說。」',to:'mira_after_wait',fx:{mira:1,mayor:-1},tag:'delay-mira'},
{t:'「妳得自己去說。這樣藏著不是辦法。」',to:'mira_after_self',fx:{mira:-1},tag:'ask-confession'},
{t:'「今天還有人等著領糧，我們先去議事廳。」',to:'mira_after_hall',fx:{crowd:1},tag:'go-hall'}]},
mira_after_truth:{chapter:'五 · 七行',title:'一起說',text:P('米拉的指尖在石階上畫了半個圈。','「要是他們只聽見我半夜進去呢？」','她把正門鑰匙放回你面前。','「好吧。」她說，「我在議事廳外等。」'),next:'hall'},
mira_after_wait:{chapter:'五 · 七行',title:'再等一等',text:P('「那你別忘了。」','米拉攥緊那本被煙燻黑的帳簿。','「我怕你跟別人一樣，說著說著就變了。」','她站起來，跟在你後面，隔著兩級石階。'),next:'hall'},
mira_after_self:{chapter:'五 · 七行',title:'一個人',text:P('「我知道。」她答得很快。','你起身時，她還坐著。','走出磨坊巷口，你回頭看了一眼。','她已經站起來，卻不是往議事廳走，而是往井邊去。'),next:'hall'},
mira_after_hall:{chapter:'五 · 七行',title:'磨坊門口',text:P('米拉慢慢把鑰匙塞回懷裡。','「倉裡還有多少麥子？」','「他們正在點。」','她望了望雨裡的議事廳，起身。','「我去拿帳本。」'),next:'hall'},
hall:{chapter:'六 · 只剩五天',title:'窗台上的人',text:P('議事廳擠得連窗台都坐了人。','老倉丁把清單遞給鎮長，手指在紙角捏出一圈濕印。','「照原來的配給，大概就五天吧。」','「五天？」有人拍桌，「冬天都還沒到！」','「去石溪村調啊！」「北橋漲水，空車都不敢過，你去？」','鎮長敲了兩下木槌，聲音被窗外的人聲吞掉。','「放火的抓到沒？」','「抓到了麥子會自己長回來嗎？」','「不抓，誰保證不會再燒一次？」','說這話的人往你這邊看。身邊兩個人默默挪開半步，挪得很有禮貌。'),choices:[
{t:'站起來，要求先查明火是誰引起的。',to:'hall_blame',fx:{crowd:-1,mayor:-1},tag:'hall-blame'},
{t:'問老倉丁還有多少能曬乾的麥子。',to:'hall_food',fx:{keeper:1,crowd:1},tag:'hall-food'},
{t:'請鎮長讓醫師先證明那十一分鐘的去向。',to:'hall_medicine',fx:{mayor:-1},tag:'hall-medicine'},
{t:'先看守橋人的地圖。',to:'hall_map',fx:{clues:1},tag:'hall-map'}]},
hall_blame:{chapter:'六 · 只剩五天',title:'另一場問訊',text:P('「所以到底誰放的火？」你問。','議事廳裡的人聲忽然矮了一截。','有人指向磨坊那條街，另一個人說守衛夜裡失職更可疑。','老倉丁把清單往桌上推。','「我只知道，五天之後，誰還有東西吃？」','守橋人把北路圖攤開，木槌落在紙邊。'),next:'cartclue'},
hall_food:{chapter:'六 · 只剩五天',title:'濕麥子',text:P('老倉丁報出一串數字，有人聽懂，有人不肯聽。','「曬了就能吃？」一個婦人問。','「得先挑，沒泡爛的才行。」','「那也不夠！」','守橋人從後排擠上來，攤出一張北路地圖，說橋頭的路肩昨夜已被掏空。'),next:'cartclue'},
hall_medicine:{chapter:'六 · 只剩五天',title:'十一分鐘',text:P('鎮長朝你望了一眼。','「醫師的事，火壓下來以後再談。」','「我不過離開十一分鐘！」','窗台有人哼了一聲：「糧倉燒完，十一分鐘也夠了。」','守橋人趁著短暫安靜，攤開地圖：「我要說的是北路。昨夜路肩被水掏空了。」'),next:'cartclue'},
hall_map:{chapter:'六 · 只剩五天',title:'北路',text:P('守橋人的手指按在一道彎曲的藍線上。','「北坡的路肩昨夜被沖掉一截。要是有車在那裡，八成下不來。」','「有車又怎樣？」一個搬運工問。','「車下不來，貨也過不了橋。」','艾倫擠到桌邊，湊近看了看那條北路。'),next:'cartclue'},
cartclue:{chapter:'六 · 只剩五天',title:'藍繩',text:P('艾倫擠到桌前。','「傍晚有輛大車往北走，我在北門見過。車尾綁著藍繩。」','「誰家的車？」鎮長問。','「藍繩？」米拉抬起頭。','她從懷裡翻出帳房的入倉登記簿，手指一行一行移，停在其中一行。','「昨天傍晚，快馬號卸了十八袋麥子給霧谷。運單是我抄的。」','窗台上有人喊：「妳還有臉翻帳？」','米拉沒有抬頭。','「車上還有三十二袋，要送去石溪。」','「三十二袋。」她又說了一次。'),choices:[
{t:'讓米拉把運單拿到鎮長面前，請守橋人一起核對。',to:'cart_confirm',fx:{mira:1,clues:1},tag:'confirm'},
{t:'先問艾倫，他究竟看清楚那輛車多少。',to:'cart_eli',fx:{eli:1},tag:'ask-cart-eli'},
{t:'提醒眾人，那是石溪村的糧，未必能給霧谷。',to:'cart_caution',fx:{mayor:1},tag:'caution'},
{t:'「既然可能有糧，先派人去找！」',to:'cart_urge',fx:{crowd:1},tag:'urge'}]},
cart_confirm:{chapter:'六 · 只剩五天',title:'三十二袋',text:P('米拉把帳簿放上桌，手指停在一行字上。','守橋人低頭核對日期。','「那車如果在昨天傍晚上北坡，正好趕上昨夜的暴雨。」','艾倫點頭。「我看到帆布，是往北走的。」','窗外有人喊：「還等什麼？快去找啊！」'),next:'departure'},
cart_eli:{chapter:'六 · 只剩五天',title:'帆布底下',text:P('「我看到的是帆布，」艾倫說，「還有車尾綁的藍繩。」','「車上有麥子嗎？」','「誰看得到帆布底下？」','有人哼了一聲。','米拉拍了拍帳簿，正想說話，艾倫抬起那隻包著布的手。','「我沒說一定有。我說我看見那台車。」'),next:'departure'},

const IDs=Object.keys(N);const defaultState=()=>({node:'opening',history:[],flags:[],mayor:0,eli:0,mira:0,keeper:0,crowd:0,clues:0,done:false});
let state=load();let displayed='';const app=document.querySelector('#app');const pageCount=document.querySelector('#pageCount');
function esc(t){return String(t).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function paras(raw){return (typeof raw==='function'?raw(state):raw)||[]}
function write(){try{localStorage.setItem(ROOT,JSON.stringify(state))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(ROOT));if(v&&v.node&&N[v.node]&&Array.isArray(v.history))return Object.assign(defaultState(),v)}catch(e){}return defaultState()}
function transition(choice){const current=N[state.node];const index=choice.index??-1;const fx=choice.fx||{};for(const k of ['mayor','eli','mira','keeper','crowd','clues'])state[k]+=(fx[k]||0);if(choice.tag)state.flags.push(choice.tag);state.history.push({node:state.node,chapter:current.chapter,selected:index,label:choice.t||'繼續',to:choice.to});state.node=choice.to;if(state.node==='finish')state.done=true;write();render();}
function render(){window.scrollTo({top:0,behavior:'instant'});const node=N[state.node];if(!node){state=defaultState();write();return render()}const step=state.history.length;pageCount.textContent=node.end?'第一集 · 完成':`${String(step+1).padStart(2,'0')} / 約 23 節`;const progress=Math.min(100,Math.max(1,step/23*100));let html=`<div class="bar"><div class="fill" style="width:${progress}%"></div></div>`;if(state.node==='opening'&&!state.history.length){html+=`<div class="landing"><div class="sigil"></div><p class="kicker">FOG VALLEY · EPISODE ONE</p><h1 class="title">霧谷紀事</h1><p class="sub">第一集｜十一分鐘</p><div class="intro"><p>雨下到第四天。</p><p>這一夜，霧谷的鐘聲會響三次。</p></div><div class="actions"><button class="continue" id="startGame">進入故事 →</button></div><p class="tiny" style="margin-top:38px">憑直覺做選擇 · 不知道如何選時，可擲情緒骰子 · 進度自動儲存</p></div>`;app.innerHTML=html;document.querySelector('#startGame').onclick=()=>{app.innerHTML=`<div class="bar"><div class="fill" style="width:1%"></div></div>`;renderScene()};return}renderScene(html)}
function renderScene(prefix){const n=N[state.node];let html=prefix||`<div class="bar"><div class="fill" style="width:${Math.min(100,state.history.length/23*100)}%"></div></div>`;html+=`<div class="ch">${esc(n.chapter||'')}</div><h1 class="title">${esc(n.title)}</h1><div class="prose">${paras(n.text).map((p,i,a)=>`<p${i===a.length-1&&n.choices?' class="last"':''}>${esc(p)}</p>`).join('')}</div>`;if(n.end){html+=`<div class="endpaper"><div class="rule"></div><p class="kicker">故事未完 · 續集待續</p><p>第一集的路到這裡。你走過的選擇，會跟著你走進下一場雨。</p><div class="codebox"><strong style="font-size:15px">冒險承接碼</strong><p class="tiny">只要記下這組短碼，第二集就能承接你的選擇；它不是登入密碼。</p><input readonly id="carryCode" aria-label="冒險承接碼" style="width:100%;font:600 24px/1.5 monospace;letter-spacing:.13em;text-align:center;padding:12px;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:4px"><div class="endactions"><button class="secondary" id="copyCode">複製承接碼</button><button class="secondary" id="saveMD">下載冒險紀錄 .md</button><button class="secondary" id="restartEnd">重新開始</button></div></div></div>`;app.innerHTML=html;document.querySelector('#carryCode').value=exportCode();document.querySelector('#copyCode').onclick=()=>navigator.clipboard?.writeText(exportCode()).then(()=>alert('已複製承接碼')).catch(()=>{const a=document.querySelector('#carryCode');a.select();document.execCommand('copy')});document.querySelector('#saveMD').onclick=downloadRecord;document.querySelector('#restartEnd').onclick=restartConfirm;return}if(n.choices){html+=`<div class="rule"></div><p class="kicker">你會怎麼做？</p><div class="choices">${n.choices.map((c,i)=>`<button class="choice" data-choice="${i}" type="button"><span class="num">${String(i+1).padStart(2,'0')}</span>${esc(c.t)}</button>`).join('')}</div>${emotionDiceUI(state.node)}`}else html+=`<div class="rule"></div><button type="button" class="continue" id="nextScene">繼續閱讀 →</button>`;app.innerHTML=html;if(n.choices)initEmotionDice(state.node);if(n.choices)app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const ix=Number(b.dataset.choice);transition({...n.choices[ix],index:ix})});else document.querySelector('#nextScene').onclick=()=>transition({to:n.next,t:'繼續',index:-1});}
function exportPayload(){return {kind:'FogValleyCarry',version:VERSION,episode:1,at:state.node,history:state.history.map(h=>[h.node,h.selected]),stats:Object.fromEntries(['mayor','eli','mira','keeper','crowd','clues'].map(k=>[k,state[k]])),flags:state.flags,complete:state.done}}

// The 11 player choices are four-way decisions. Pack each as two bits.
// A checksum catches mistyped codes; this is not a password or encryption.
const CHOICE_COUNT=11;
function checksum(n){return ((n*73+421) % 1296).toString(36).toUpperCase().padStart(2,'0')}
function exportCode(){
 const picks=state.history.filter(h=>h.selected>=0).map(h=>h.selected);
 if(picks.length!==CHOICE_COUNT||picks.some(x=>x<0||x>3))return '尚未完成第一集';
 let n=0;for(const x of picks)n=n*4+x;
 return 'FV2-'+n.toString(36).toUpperCase().padStart(5,'0')+checksum(n);
}
function decodeCode(code){
 const cleaned=code.trim().toUpperCase().replace(/\\s+/g,'');
 const match=cleaned.match(/^FV2-?([0-9A-Z]{5})([0-9A-Z]{2})$/);
 if(match){
  const n=parseInt(match[1],36);
  if(n>=4**CHOICE_COUNT||checksum(n)!==match[2])throw Error('承接碼有誤，請檢查字元');
  const picks=[];let v=n;
  for(let i=0;i<CHOICE_COUNT;i++){picks.unshift(v%4);v=Math.floor(v/4)}
  return {kind:'FogValleyCompact',picks};
 }
 // Backward compatibility with original long FV1 codes.
 const v=code.trim().replace(/^FV1-/i,'').replace(/-/g,'+').replace(/_/g,'/');
 const data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(v),c=>c.charCodeAt(0))));
 if(data.kind!=='FogValleyCarry'||data.version!==VERSION||!Array.isArray(data.history)||data.history.length>100)throw Error('承接碼格式不符');
 return data;
}
function replay(data){
 let seq;
 if(data.kind==='FogValleyCompact'){
  seq=[];let id='opening',choiceNumber=0;
  for(let steps=0;steps<120&&id!=='finish';steps++){
   const node=N[id];if(!node)throw Error('故事節點不存在');
   if(node.choices){
    if(choiceNumber>=data.picks.length)throw Error('選擇數量不足');
    const index=data.picks[choiceNumber++];
    if(!node.choices[index])throw Error('無效的遊戲選項');
    seq.push([id,index]);id=node.choices[index].to;
   }else{
    if(!node.next)throw Error('故事尚未到終點');
    seq.push([id,-1]);id=node.next;
   }
  }
  if(id!=='finish'||choiceNumber!==CHOICE_COUNT)throw Error('選擇碼與故事版本不符');
 }else seq=data.history;
 let next=defaultState();
 for(const h of seq){
  const [id,index]=h;if(next.node!==id||!N[id])throw Error('選擇順序不符');
  const n=N[id];
  let c=index>=0?n.choices?.[index]:n.next?{to:n.next,t:'繼續'}:null;
  if(!c||!N[c.to])throw Error('承接碼中有無效的選擇');
  for(const k of ['mayor','eli','mira','keeper','crowd','clues'])next[k]+=(c.fx?.[k]||0);
  if(c.tag)next.flags.push(c.tag);
  next.history.push({node:id,chapter:n.chapter,selected:index,label:c.t||'繼續',to:c.to});
  next.node=c.to;
 }
 next.done=next.node==='finish';
 return next;
}
function downloadRecord(){const rows=['# 霧谷紀事｜第一集冒險紀錄','','本次路線：',''];for(const [i,h] of state.history.entries())if(h.selected>=0)rows.push(`${i+1}. **${h.chapter}**：${h.label}`);rows.push('','## 第一集承接碼','',exportCode(),'','> 第二集可用此碼接續；此碼包含選擇紀錄，不含姓名。');const b=new Blob([rows.join('\n')],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='霧谷紀事_第一集冒險紀錄.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restartConfirm(){if(confirm('確定要從頭開始？目前的進度會被覆蓋。建議先保存承接碼。')){state=defaultState();write();render()}}
const modal=document.querySelector('#dialog');document.querySelector('#toolsBtn').onclick=()=>{modal.hidden=false;document.querySelector('#importError').textContent=''};document.querySelector('#closeModal').onclick=()=>modal.hidden=true;document.querySelector('#resumeBtn').onclick=()=>modal.hidden=true;document.querySelector('#restartBtn').onclick=()=>{modal.hidden=true;restartConfirm()};document.querySelector('#importBtn').onclick=()=>{try{state=replay(decodeCode(document.querySelector('#importCode').value));write();modal.hidden=true;render()}catch(e){document.querySelector('#importError').textContent='無法讀取這組紀錄碼：'+e.message}};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});
render();
