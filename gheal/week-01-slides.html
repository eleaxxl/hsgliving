<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#253b32">
<title>療癒罪咎｜第一週課堂簡報（修訂版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#ede4d6;--sage:#dbe4db;--dark:#253b32;--ivory:#faf6f0;--gold:#b1a073;--ink:#263b32}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#e3e4dd;color:var(--ink);font:15px/1.6 'Noto Sans TC',sans-serif}
button{font:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:16px 16px 62px}
#stage{position:relative;aspect-ratio:16/9;width:min(calc(100vw - 32px),calc((100dvh - 82px)*16/9));max-height:calc(100dvh - 82px);overflow:hidden;box-shadow:0 20px 55px rgba(31,42,34,.15);background:var(--cream);user-select:none;isolation:isolate}
#pageImage{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;transition:opacity .15s ease}
#pdfFooter{position:absolute;inset:auto 0 0;height:8%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6.4% 2.15%;font:500 clamp(8px,1.08vw,15px)/1.3 'Noto Serif TC',serif;letter-spacing:.02em;z-index:3}
#pdfFooter.dark{color:#e7e6db}#pdfFooter:not(.dark){color:#67736d}
#pdfFooter .num{font-family:'Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.07em}
.hotspot{position:absolute;z-index:8;display:block;border:2px solid transparent;border-radius:5px;transition:background .16s,border-color .16s}
.hotspot:hover,.hotspot:focus-visible{background:rgba(177,160,115,.19);border-color:rgba(177,160,115,.5);outline:0}
.hotspot:after{content:'↗';display:none;position:absolute;right:3px;top:0;font:700 clamp(12px,1.7vw,25px) 'Noto Sans TC',sans-serif;color:#d5ba84}
.hotspot:hover:after,.hotspot:focus-visible:after{display:block}
#controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(249,247,242,.96);border:1px solid rgba(38,59,50,.14);box-shadow:0 7px 24px rgba(24,42,33,.11);z-index:40;transition:opacity .25s}
#controls button{border:none;background:transparent;color:#344c3d;min-width:35px;height:33px;border-radius:99px;font:600 17px 'Noto Sans TC',sans-serif}
#controls button:hover{background:#e7ebe4}#controls button:disabled{opacity:.3;cursor:default}
#counter{font:600 12px 'Noto Sans TC',sans-serif;min-width:64px;text-align:center;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.sep{height:22px;width:1px;background:#d5dcd1;margin:0 4px}
#progress{position:fixed;bottom:0;left:0;width:100%;height:3px;background:rgba(37,59,50,.13);z-index:35}#fill{height:100%;width:0;background:#7f9785;transition:width .2s}
#overlay{position:fixed;inset:0;background:rgba(24,39,31,.9);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
#overlay.open{display:flex}
#panel{background:#f6f2e9;border-radius:14px;width:min(1050px,100%);max-height:87dvh;overflow:auto;padding:22px;color:#25392d;box-shadow:0 20px 85px rgba(0,0,0,.28)}
.overlayHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.overlayHead h2{font:600 20px 'Noto Serif TC',serif;margin:0}
#close{border:1px solid #cad3c8;background:transparent;color:#344b3b;border-radius:99px;padding:6px 16px}
#thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.thumb{border:1px solid #ccc7bc;background:white;padding:6px;cursor:pointer;text-align:left;border-radius:7px;position:relative;color:#4b5a4f}
.thumb:hover,.thumb:focus-visible{border-color:#728a79;outline:2px solid rgba(114,138,121,.2)}
.thumb.active{border-color:#607c68;box-shadow:0 0 0 2px #607c68}
.thumb img{width:100%;aspect-ratio:16/9;display:block;object-fit:contain}
.thumb span{display:block;font:600 12px 'Noto Sans TC',sans-serif;padding:5px 4px 2px}
#guide{font:14px/1.85 'Noto Serif TC',serif;color:#6b716a;margin:0 0 12px}
#stage:focus-visible{outline:3px solid #8da393;outline-offset:3px}
body.hideControls #controls{opacity:0;pointer-events:none}
@media(max-width:740px){#wrap{padding:0 0 68px}#stage{width:100vw;max-height:calc(100dvh - 70px);box-shadow:none}#thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}#pdfFooter{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="wrap"><div id="stage" tabindex="0" aria-label="第一週課堂投影片">
  <img id="pageImage" alt="目前的投影片">
  <div id="pdfFooter"><span>不只讀書的讀書會 · 療癒罪咎</span><span class="num" id="slideNumber"></span></div>
  <div id="hotspots"></div>
</div></div>
<div id="controls" aria-label="簡報控制列">
  <button id="prev" title="上一頁（←）" aria-label="上一頁">‹</button>

  <button id="next" title="下一頁（→ 或空白鍵）" aria-label="下一頁">›</button>
  <span class="sep"></span>
  <button id="indexButton" title="頁面總覽（M）" aria-label="頁面總覽">☷</button>
  <button id="fullButton" title="全螢幕（F）" aria-label="全螢幕">⛶</button>
  <button id="hideButton" title="隱藏操作列（H）" aria-label="隱藏操作列">◌</button>
</div>
<div id="progress"><div id="fill"></div></div>
<div id="overlay" role="dialog" aria-modal="true" aria-label="投影片總覽"><div id="panel">
<div class="overlayHead"><h2>第一週｜投影片總覽</h2><button id="close">關閉 ×</button></div>
<p id="guide">共 21 頁，依照修訂後的簡報 PDF 順序。點選縮圖即可跳頁。鍵盤方向鍵可切換，F 全螢幕，H 隱藏控制列。</p>

 b.append(im,label);b.addEventListener('click',()=>{closeIndex();go(i)});thumbs.append(b)
 });overlay.classList.add('open');document.getElementById('close').focus();
}
function closeIndex(){overlay.classList.remove('open');stage.focus()}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
document.getElementById('prev').onclick=()=>go(current-1);
document.getElementById('next').onclick=()=>go(current+1);
document.getElementById('indexButton').onclick=openIndex;
document.getElementById('fullButton').onclick=toggleFull;
document.getElementById('hideButton').onclick=()=>document.body.classList.toggle('hideControls');
document.getElementById('close').onclick=closeIndex;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeIndex()});
document.addEventListener('keydown',e=>{
 if(overlay.classList.contains('open')){if(e.key==='Escape')closeIndex();return}
 if(e.target.closest('a,button,input,textarea'))return;
 const k=e.key.toLowerCase();
 if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();go(current+1)}
 else if(['arrowleft','arrowup','pageup','backspace'].includes(k)){e.preventDefault();go(current-1)}
 else if(k==='home'){go(0)}else if(k==='end'){go(slides.length-1)}
 else if(k==='m')openIndex();else if(k==='f')toggleFull();else if(k==='h')document.body.classList.toggle('hideControls');
});
stage.addEventListener('touchstart',e=>{touchStart={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}}, {passive:true});
stage.addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].screenX-touchStart.x,dy=e.changedTouches[0].screenY-touchStart.y;touchStart=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)go(current+(dx<0?1:-1))},{passive:true});
const match=location.hash.match(/^#slide-(\d+)$/);if(match)current=Math.min(slides.length-1,Math.max(0,Number(match[1])-1));render();
</script>
