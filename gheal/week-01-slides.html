<script>
'use strict';
const slides=[{"section":"開場","title":"重新認識罪咎","html":"<p class=\"giant-sub\">《療癒罪咎》｜第一週</p><div class=\"hairline\"></div><p class=\"hero-micro\">不只讀書的讀書會 · 2026.11.27</p>","layout":"cover","tone":"dark","notes":"開場不要先解釋機制。今天的目的：先讀、先經驗，再重新理解第一、二篇。","subtitle":""},{"section":"第一篇","title":"沒有誰是壞人，<br>你也不是。","html":"<p class=\"foot-poem\">這句話，先放在這裡。</p>","layout":"statement","tone":"cream","notes":"只破題，不要求學員立刻相信。第一篇的完整解釋與二十四原則在最後一週回看。","subtitle":""},{"section":"第一篇","title":"第一篇，<br>是整本書的起點。","html":"<div class=\"two-ideas\"><div><span class=\"mini-eyebrow\">今天先帶走</span><p>一個可以練習的工具</p></div><div><span class=\"mini-eyebrow\">留到最後再讀</span><p>二十四點原則</p></div></div>","layout":"split","tone":"light","notes":"整合練習來自第一篇，並非首週專屬，可以貫穿整本書。二十四點原則不在第一週講透。","subtitle":""},{"section":"第一篇","title":"雙手整合","html":"<p class=\"intro-large\">有些問題，不必只靠頭腦尋找答案。</p><a class=\"launch\" href=\"./hand-integration.html\" target=\"_blank\" rel=\"noopener noreferrer\">開啟整合練習 <span>↗</span></a>","layout":"exercise","tone":"sage","notes":"操作連結開新分頁；視課堂節奏可在破題後立即使用，亦可開場先做。此練習是整本書的工具。","subtitle":""},{"section":"第一篇","title":"污泥來了！<br>快從河裡跳出來啊！","html":"<p class=\"foot-poem\">罪惡感的影響，遠比我們想像的廣泛。</p>","layout":"statement","tone":"cream","notes":"這是第一篇的題目，不需先講細節；用來轉到罪咎的影響範圍。","subtitle":""},{"section":"第一篇","title":"我們平常所說的<br>「罪惡感」","html":"<div class=\"center-small\">虧欠　·　內疚　·　自責</div><p class=\"foot-poem\">只有這些嗎？</p>","layout":"statement","tone":"light","notes":"在活動前可以把一般理解提出來，但不要揭露「攻擊與補償」或歷史練習的用意。","subtitle":""},{"section":"第一篇","title":"無罪無咎","html":"<div class=\"two-words\"><span>寬恕</span><i>與</i><span>純真</span></div><p class=\"foot-poem\">先記住方向，暫時不急著抵達。</p>","layout":"statement","tone":"sage","notes":"這裡只提出寬恕與純真兩條出路。深入談純真、找回純真、善惡、無罪條款，留給「破繭而出，重獲自由」。","subtitle":""},{"section":"第一篇","title":"別對自己那樣","html":"<div class=\"pair-list\"><p><b>01</b> 罪咎會形成惡性循環</p><p><b>02</b> 我們如何看待自己，也影響我們如何看待世界</p></div>","layout":"standard","tone":"light","notes":"先作兩個伏筆：「惡性循環」在後半說；「對世界負責任」在 Responsibility 段落說。不要詳解。","subtitle":""},{"section":"閱讀體驗","title":"先讀一個故事。","html":"<p class=\"intro-large\">1692 年，塞勒姆。</p><p class=\"muted-larger\">不必尋找標準答案。只要依照你讀到的，做出判斷。</p>","layout":"pause","tone":"dark","notes":"活動前不播放第二篇模型，不提供「你正在投射」等提示。讓學員自然選擇。","subtitle":""},{"section":"閱讀體驗","title":"誰有罪？","html":"<p class=\"intro-large\">一場女巫審判，幾種不同的回答。</p><a class=\"launch bright\" href=\"./who-is-guilty.html\" target=\"_blank\" rel=\"noopener noreferrer\">進入閱讀練習 <span>↗</span></a>","layout":"exercise","tone":"dark","notes":"開新分頁完成〈誰有罪？〉。課堂可暫停投影；待學員完成後回到本簡報。此頁以前不要揭露任何罪咎理論。","subtitle":""},{"section":"體驗之後","title":"剛剛，<br>你認為誰有罪？","html":"<p class=\"foot-poem\">先不急著更改答案。</p>","layout":"question","tone":"cream","notes":"回到閱讀練習的第一題。可邀請少量分享判斷依據；不公布正解。","subtitle":""},{"section":"體驗之後","title":"誰受到了懲罰？","html":"<p class=\"foot-poem\">有罪，與受到懲罰，是一樣的事嗎？</p>","layout":"question","tone":"light","notes":"拉出罪與懲罰的關係。不要診斷故事人物的內在罪咎。","subtitle":""},{"section":"體驗之後","title":"當我被誤解，<br>我會做什麼？","html":"<div class=\"two-words\" style=\"font-size:clamp(25px,3.9cqw,57px)\"><span>證明清白</span><i>或</i><span>不作辯解</span></div>","layout":"question","tone":"sage","notes":"A/B/C 閱讀練習已帶出這兩難，可提問但不再要求隱私揭露。","subtitle":""},{"section":"第二篇","title":"小我、罪咎與攻擊","html":"<p class=\"intro-large\">真正要看的，並不只是「我有沒有做錯」。</p>","layout":"chapter","tone":"dark","notes":"從此開始進入第二篇的主要教學。上一頁完成活動，現在才正式披露模型。","subtitle":""},{"section":"核心機制","title":"罪　→　懲罰","html":"<div class=\"big-equation\"><span>罪</span><span class=\"long-arrow\">→</span><span>懲罰</span></div><p class=\"foot-poem\">一旦認定「有罪」，懲罰就成了理所當然的下一步。</p>","layout":"equation","tone":"light","notes":"此為 Elea 整理 Chuck 敘事的教學框架，並非原書的逐字章節架構。","subtitle":""},{"section":"核心機制","title":"懲罰，往哪裡去？","html":"<div class=\"branch\"><div class=\"branch-card\"><span>向外</span><strong>攻擊</strong><small>把懲罰轉嫁給他人</small></div><div class=\"branch-card\"><span>向內</span><strong>補償</strong><small>讓懲罰落在自己身上</small></div></div>","layout":"branch","tone":"cream","notes":"攻擊與補償不是兩種人格類型，同一人可在不同情境使用兩者。補償不等於所有責任行為，需看它是否由罪咎驅動。","subtitle":""},{"section":"攻擊","title":"當懲罰指向別人","html":"<div class=\"word-field\"><span>責怪</span><span>譴責</span><span>定罪</span><span>報復</span></div><p class=\"foot-poem\">「錯的是你，不是我。」</p>","layout":"words","tone":"light","notes":"對外攻擊是把罪責與懲罰轉嫁給他人。注意不是所有反對意見或維護界線都是罪咎；此處是探索可能的無意識機制。","subtitle":""},{"section":"補償","title":"當懲罰回到自己","html":"<div class=\"word-field\"><span>切斷連結</span><span>犧牲</span><span>假性負責</span><span>救贖</span></div><p class=\"foot-poem\">「是不是我做得還不夠？」</p>","layout":"words","tone":"sage","notes":"補償為自我懲罰的方向；假性負責與真正 responsibility 應在後面區分。","subtitle":""},{"section":"關鍵轉折","title":"「我本來就沒錯。」","html":"<p class=\"foot-poem\">這句話在防衛什麼？</p>","layout":"question","tone":"dark","notes":"讓學員自己回答。可與閱讀練習中的反應對照。","subtitle":""},{"section":"關鍵轉折","title":"我為何如此努力，<br>證明自己沒有罪？","html":"<div class=\"line-center\"></div><p class=\"foot-poem\">如果不曾預設「罪」的可能，還需要這樣證明嗎？</p>","layout":"statement","tone":"cream","notes":"只指出概念上的前提，不由此斷定每個自我辯護的人都懷有罪咎。帶領者抓住這個疑問即可。","subtitle":""},{"section":"隱藏","title":"罪咎在防衛什麼？","html":"<p class=\"intro-large\">它可能被用來隱藏：</p><div class=\"one-word\">對人生下一步的恐懼</div>","layout":"statement","tone":"light","notes":"對應第二篇「它被用來當作防衛，用以隱藏我們對人生向前邁進的恐懼」。","subtitle":""},{"section":"隱藏","title":"我們害怕的下一步","html":"<div class=\"quadrants\"><div><small>01</small><strong>下一步</strong></div><div><small>02</small><strong>成功</strong></div><div><small>03</small><strong>夥伴關係</strong></div><div><small>04</small><strong>人生使命</strong></div></div>","layout":"quadrants","tone":"sage","notes":"用四象限極簡呈現，這些是底層恐懼，不是四種性格。","subtitle":""},{"section":"罪咎的謬誤","title":"七種熟悉的面貌","html":"<div class=\"num-grid\"><div><em>01</em>小我的糧食</div><div><em>02</em>不前進的藉口</div><div><em>03</em>特殊性與執著</div><div><em>04</em>自我概念與報復</div><div><em>05</em>競爭</div><div><em>06</em>控制</div><div><em>07</em>叛逆</div></div>","layout":"list","tone":"light","notes":"這七點依使用者對第二篇的整理而編排；不等於原書的逐字七條編號。","subtitle":""},{"section":"罪咎的目的","title":"這些面貌，<br>共同指向什麼？","html":"<p class=\"intro-large\">拖住下一步，維持舊的自我故事。</p><p class=\"foot-poem\">更深處：延續與老天的權力鬥爭。</p>","layout":"statement","tone":"dark","notes":"這裡先點出目的，細部源起與靈魂觀將在後續篇章討論。","subtitle":""},{"section":"責任","title":"Responsibility","html":"<div class=\"word-break\"><span>Response<small>回應</small></span><b>+</b><span>Ability<small>能力</small></span></div><p class=\"foot-poem\">面對情境，做出適切回應的能力。</p>","layout":"equation","tone":"cream","notes":"這是教學式拆解，不是嚴格語源學證明。Chuck 的段落重點不是道德譴責或把所有事攬上身，而是回應能力。","subtitle":""},{"section":"責任","title":"反應過度，<br>或反應不足。","html":"<div class=\"branch\"><div class=\"branch-card\"><span>Too much</span><strong>過度反應</strong><small>急著攻擊、辯解、掌控</small></div><div class=\"branch-card\"><span>Too little</span><strong>反應不足</strong><small>退縮、無助、放棄回應</small></div></div><p class=\"foot-poem\">罪咎可能讓我們失去適切回應的能力。</p>","layout":"branch","tone":"light","notes":"對應使用者引用 Chuck 的段落：不是反應過度，就是未做出應有反應。以這段對照假性負責的補償。","subtitle":""},{"section":"責任","title":"我正在回應的是——","html":"<div class=\"two-words\"><span>眼前的情境</span><i>還是</i><span>內在的罪咎？</span></div>","layout":"question","tone":"sage","notes":"這是本週最適合拋給學員的實用辨識問題之一。","subtitle":""},{"section":"惡性循環","title":"罪咎的惡性循環","html":"<div class=\"cycle\"><div>罪咎</div><i>→</i><div>攻擊</div><i>→</i><div>更糟的感受</div><i>↺</i></div><p class=\"foot-poem\">攻擊別人，也可能同時攻擊自己。</p>","layout":"equation","tone":"light","notes":"解釋「受害」與「自責」兩面相伴。情緒越糟越易重複攻擊，罪咎繼續加深。後續第八篇會再談與其他負面情緒合作。","subtitle":""},{"section":"後續閱讀","title":"這些問題，<br>我們還會再回來。","html":"<div class=\"roadmap\"><div><span>第 3–4 篇</span><b>罪咎的源起</b></div><div><span>第 6–7 篇</span><b>生命目的</b></div><div><span>第 8 篇</span><b>負面情緒</b></div><div><span>第 9 篇</span><b>超越善惡</b></div><div><span>第 10 篇</span><b>解脫之道</b></div></div>","layout":"roadmap","tone":"cream","notes":"不要在首週把這些提前講透。第一篇的 24 原則及無罪條款安排在尾聲「破繭而出，重獲自由」專題。","subtitle":""},{"section":"最後的方向","title":"純真與連結","html":"<div class=\"two-ideas\"><div><span class=\"mini-eyebrow\">純真</span><p>停止懲罰自己與他人</p></div><div><span class=\"mini-eyebrow\">連結</span><p>通向完整的道路</p></div></div><p class=\"foot-poem\">現在只是看見方向。</p>","layout":"split","tone":"sage","notes":"第二篇「罪咎的反面—純真與連結」挪到這裡作為收束。不展開「何謂純真」與回天家的形上學細節。","subtitle":""},{"section":"課後","title":"再回頭讀一次。","html":"<p class=\"intro-large\">第一篇，與第二篇。</p><p class=\"foot-poem\">有沒有一句話，現在讀起來和第一次不同？</p>","layout":"statement","tone":"dark","notes":"課後請學員重新閱讀兩篇。不是理解測驗，也不要求同意作者。第一週先走一趟，再回頭讀。","subtitle":""}];
let current=0, overlayKind='', touchStart=null;
const stage=document.getElementById('stage'), slide=document.getElementById('slide'), overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlayTitle'),overlayBody=document.getElementById('overlayBody');
function render(){
 const data=slides[current];stage.className=data.tone;
 slide.className=data.layout;slide.innerHTML=`<div class="kicker">${data.section}</div><h1 class="slide-title">${data.title}</h1><div class="slide-body">${data.html}</div>`;
 document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
 document.getElementById('sNo').textContent=String(current+1).padStart(2,'0');
 document.getElementById('progressFill').style.width=((current+1)/slides.length*100)+'%';
 document.getElementById('prev').disabled=(current===0);document.getElementById('next').disabled=(current===slides.length-1);
 document.title=`${current+1}/${slides.length}｜${data.title.replace(/<[^>]*>/g,'')}｜療癒罪咎`;
 try{history.replaceState(null,'','#slide-'+(current+1));}catch(e){}
}
function go(n){current=Math.min(slides.length-1,Math.max(0,n));render()}
function showOverlay(kind){overlayKind=kind;overlay.classList.add('open');if(kind==='index'){overlayTitle.textContent='簡報目錄';overlayBody.innerHTML='<div class="indexGrid">'+slides.map((s,i)=>`<button class="indexItem" data-slide="${i}"><small>${String(i+1).padStart(2,'0')} · ${s.section}</small>${s.title.replace(/<br\s*\/?\s*>/g,'')}</button>`).join('')+'</div>';overlayBody.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>{closeOverlay();go(Number(b.dataset.slide))}));}else{overlayTitle.textContent=`講者備註 · ${current+1}/${slides.length}`;const e=document.createElement('p');e.className='speakerNote';e.textContent=slides[current].notes||'本頁無額外備註。';overlayBody.replaceChildren(e)}}
function closeOverlay(){overlay.classList.remove('open');overlayKind=''}
document.getElementById('prev').addEventListener('click',()=>go(current-1));document.getElementById('next').addEventListener('click',()=>go(current+1));
document.getElementById('indexButton').addEventListener('click',()=>showOverlay('index'));
document.getElementById('notesButton').addEventListener('click',()=>showOverlay('notes'));
document.getElementById('fullButton').addEventListener('click',()=>{if(!document.fullscreenElement){(document.documentElement.requestFullscreen||(()=>{})).call(document.documentElement)}else{document.exitFullscreen?.()}});
document.getElementById('closeOverlay').addEventListener('click',closeOverlay);overlay.addEventListener('click',e=>{if(e.target===overlay)closeOverlay()});
document.addEventListener('keydown',e=>{if(e.target.closest('a,button,input,textarea'))return;if(overlay.classList.contains('open')){if(e.key==='Escape')closeOverlay();return}if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='f'){document.getElementById('fullButton').click()}else if(e.key.toLowerCase()==='n'){showOverlay('notes')}else if(e.key.toLowerCase()==='m'){showOverlay('index')}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(slides.length-1)}});
stage.addEventListener('touchstart',e=>{touchStart={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}}, {passive:true});
stage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].screenX-touchStart.x,dy=e.changedTouches[0].screenY-touchStart.y;touchStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1))},{passive:true});
let hash=location.hash.match(/^#slide-(\d+)$/);if(hash)current=Math.min(slides.length-1,Math.max(0,Number(hash[1])-1));render();
</script></body></html>
